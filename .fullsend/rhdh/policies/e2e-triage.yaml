---
version: 1

# Sandbox policy for the e2e-triage agent.
# forked-from: rhdh/policies/code.yaml
#
# Differences from code.yaml:
#   - package_registries removed (triage doesn't build or install packages)
#   - github_api remains read-only (writes happen in the post-script)
#   - prow_artifacts retained for downloading nightly CI artifacts
#   - **/gh binary for GitHub read operations (issue search, dedup)

filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /proc, /dev/urandom, /app, /etc, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  vertex_ai:
    name: vertex-ai
    endpoints:
      - host: "api.anthropic.com"
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-write
      - host: "*.googleapis.com"
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-write
    binaries:
      - path: "**/claude"
      # Claude Code 2.1+ ships the bun compile as claude.exe; **/claude does not match it.
      - path: "**/claude.exe"
      - path: "**/node"

  github_api:
    name: github-api
    endpoints:
      - host: "api.github.com"
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: "github.com"
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - path: "**/curl"
      - path: "**/gh"
      - path: "**/git"
      - path: "**/node"

  prow_artifacts:
    name: prow-artifacts
    endpoints:
      - host: "prow.ci.openshift.org"
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: "gcsweb-ci.apps.ci.l2s4.p1.openshiftapps.com"
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: "storage.googleapis.com"
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - path: "**/curl"
      - path: "**/node"
      - path: "**/gcloud"

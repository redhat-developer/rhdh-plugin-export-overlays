# Pinned to agents@v0.57.1 (commit ea29de9b), matching the fullsend@v0.57.1
# CLI our own .github/workflows/fullsend.yaml pins — these are companion
# releases cut together, so this is the harness content the installed CLI
# was actually built and tested against.
base: https://raw.githubusercontent.com/fullsend-ai/agents/ea29de9bb8b1729b04c0597b48a5c7aae62deb71/harness/code.yaml#sha256=cfa49d4677cc4d6544fcf878e05b0f95620bbb62907289dbc5a22681a7679976
agent: rhdh/agents/code.md
image: ghcr.io/redhat-developer/rhdh-fullsend-code:0.57.1
policy: rhdh/policies/code.yaml
host_files:
  - src: rhdh/env/rhdh-toolchain.env
    dest: /sandbox/workspace/.env.d/rhdh-toolchain.env
  - src: rhdh/env/yarn-proxy.env
    dest: /sandbox/workspace/.env.d/yarn-proxy.env
env:
  runner:
    CODE_ALLOWED_TARGET_BRANCHES: "main,release-1.9,release-1.10,release-2.1"
skills:
  - skills/e2e-failure-analysis

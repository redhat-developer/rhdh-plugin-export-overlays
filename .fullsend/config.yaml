# This file is managed by 'fullsend repos': repos-config-v1
# Do not edit this file directly; changes will be overwritten.
tracker:
    github:
        allowed_targets:
            repos:
                - redhat-developer/rhdh-plugin-export-overlays
                - fullsend-ai/fullsend
runtime: claude
roles:
    - triage
    - coder
    - review
    - fix
    - retro
    - prioritize
agents:
    - name: code
      source: rhdh/harness/code.yaml
    - name: fix
      source: rhdh/harness/fix.yaml
    - name: review
      source: rhdh/harness/review.yaml
      subagents:
        default: inherit
    - name: e2e-triage
      source: rhdh/harness/e2e-triage.yaml
    - name: ci-diagnose
      source: rhdh/harness/ci-diagnose.yaml
allowed_remote_resources:
    - https://raw.githubusercontent.com/fullsend-ai/fullsend/
    - https://raw.githubusercontent.com/fullsend-ai/agents/
models:
    aliases:
        haiku: claude-haiku-4-5
        opus: claude-opus-5-5
        sonnet: claude-sonnet-5-5

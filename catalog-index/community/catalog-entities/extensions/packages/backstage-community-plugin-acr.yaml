  # Tag: bs_1.54.6__1.28.0
  dynamicArtifact: "oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-acr@sha256:6f074b379955f4f8b272f136f2e562591d706ca7abb837ee0da508d7dd3cb9ee"

# yaml-language-server: $schema=https://raw.githubusercontent.com/redhat-developer/rhdh-plugins/refs/heads/main/workspaces/extensions/json-schema/packages.json
apiVersion: extensions.backstage.io/v1alpha1
kind: Package
metadata:
  name: dynatrace-backstage-plugin-dql
  namespace: dynatrace
  title: "DQL Frontend"
  links:
    - url: https://www.dynatrace.com/
      title: Homepage
    - url: https://github.com/Dynatrace/backstage-plugin/issues
      title: Issues
    - title: Source Code
      url: https://github.com/Dynatrace/backstage-plugin
  annotations:
    backstage.io/source-location: url:https://github.com/Dynatrace/backstage-plugin
  tags: []
spec:
  packageName: "@dynatrace/backstage-plugin-dql"
  # Tag: bs_1.49.4__2.7.0
  dynamicArtifact: "oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/dynatrace-backstage-plugin-dql@sha256:51b09bbbcb4e1b7c729c33dc7b938b41e1522e3ad34fafd0d19faee05e7aaaf0"
  version: 2.7.0
  backstage:
    role: frontend-plugin
    supportedVersions: 1.49.4
  author: Dynatrace
  support: community
  lifecycle: active
  partOf:
    - dynatrace-commercial
  appConfigExamples:
    - title: Default configuration
      content:
        dynamicPlugins:
          frontend:
            dynatrace.backstage-plugin-dql:
              mountPoints:
                - mountPoint: entity.page.monitoring/cards
                  importName: DynatraceTab
                  config:
                    layout:
                      gridColumn: 1 / -1
                    if:
                      allOf:
                        - isDynatraceAvailable

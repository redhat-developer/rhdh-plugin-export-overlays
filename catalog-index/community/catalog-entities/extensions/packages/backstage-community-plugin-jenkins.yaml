  tags: []
spec:
  packageName: "@backstage-community/plugin-jenkins"
  # Tag: bs_1.54.9__0.34.0
  dynamicArtifact: "oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-jenkins@sha256:659600e2b0cd8266054c73a30038c8a0c65281756b8e5ad0d43b09a527cca12c"

apiVersion: extensions.backstage.io/v1alpha1
kind: Package
metadata:
  name: backstage-community-plugin-jenkins-backend
  namespace: rhdh
  title: "Jenkins Backend"
  links:
    - url: https://red.ht/rhdh
      title: Homepage
    - url: https://github.com/backstage/community-plugins/issues
      title: Bugs
    - title: Source Code
      url: https://github.com/backstage/community-plugins/tree/main/workspaces/jenkins
  annotations:
    backstage.io/source-location: url:https://github.com/backstage/community-plugins/tree/main/workspaces/jenkins
  tags: []
spec:
  packageName: "@backstage-community/plugin-jenkins-backend"
  # Tag: bs_1.54.9__0.31.0
  dynamicArtifact: "oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-jenkins-backend@sha256:a2a083ba38ad6dcb82c3f5e0af4fb747cd56c73e3763a461d6bc6055cf7579f4"
  version: 0.31.0
  backstage:
    role: backend-plugin
    supportedVersions: 1.54.6
  author: Red Hat
  support: community
  lifecycle: active
  partOf:
    - jenkins
  # The default example uses legacy top-level jenkins.* keys (not jenkins.instances)
  # because the scaffolder-backend-module-jenkins package reads jenkins.baseUrl at
  # startup and smoke tests merge pluginConfig from every plugin in this workspace.
  # jenkins-backend rejects having both styles in the same config.
  appConfigExamples:
    - title: Default configuration
      content:
        jenkins:
          baseUrl: ${JENKINS_URL}
          username: ${JENKINS_USERNAME}
          apiKey: ${JENKINS_TOKEN}
    - title: Multiple global instances
      content:
        jenkins:
          instances:
            - name: default
              baseUrl: ${JENKINS_URL}
              username: ${JENKINS_USERNAME}
              apiKey: ${JENKINS_TOKEN}
            - name: departmentFoo
              baseUrl: https://jenkins-foo.example.com
              username: ${JENKINS_USERNAME}
              apiKey: ${JENKINS_TOKEN}

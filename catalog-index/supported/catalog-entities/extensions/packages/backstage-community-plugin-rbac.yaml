apiVersion: extensions.backstage.io/v1alpha1
kind: Package
metadata:
  name: backstage-community-plugin-rbac
  namespace: rhdh
  title: RBAC
  links:
    - url: https://red.ht/rhdh
      title: Homepage
    - url: https://github.com/backstage/community-plugins/issues
      title: Bugs
    - title: Source Code
      url: https://github.com/backstage/community-plugins/tree/main/workspaces/rbac
  annotations:
    backstage.io/source-location: url:https://github.com/backstage/community-plugins/tree/main/workspaces/rbac
  tags: []
spec:
  packageName: '@backstage-community/plugin-rbac'
  # Tag: bs_1.54.9__2.3.4
  dynamicArtifact: "oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-rbac@sha256:776f5d5f9c64593728bdc36ba78c483dfe6941e15bec6bc3770c6e4a4036cb14"
  version: 2.3.4
  backstage:
    role: frontend-plugin
    supportedVersions: 1.54.9
  author: Red Hat
  support: generally-available
  lifecycle: active
  partOf:
    - rbac
  appConfigExamples:
    - title: Default configuration
      content:
        dynamicPlugins:
          frontend:
            backstage-community.plugin-rbac:
              translationResources:
                - importName: rbacTranslations
                  ref: rbacTranslationRef
              # 2.3.2+ no longer exposes Scalprum Legacy; default module has RbacPage/RbacIcon.
              appIcons:
                - name: rbacIcon
                  importName: RbacIcon
              dynamicRoutes:
                - path: /rbac
                  importName: RbacPage
                  menuItem:
                    icon: rbacIcon
                    text: RBAC
                    textKey: menuItem.rbac
              menuItems:
                rbac:
                  parent: default.admin
                  icon: rbacIcon

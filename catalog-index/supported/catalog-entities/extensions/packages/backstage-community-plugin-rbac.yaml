apiVersion: extensions.backstage.io/v1alpha1
kind: Package
metadata:
  name: backstage-community-plugin-rbac
  namespace: rhdh
  title: RBAC
  links:
    - url: https://red.ht/rhdh
      title: Homepage
    - url: https://github.com/backstage/community-plugins/issues
      title: Bugs
    - title: Source Code
      url: https://github.com/backstage/community-plugins/tree/main/workspaces/rbac
  annotations:
    backstage.io/source-location: url:https://github.com/backstage/community-plugins/tree/main/workspaces/rbac
  tags: []
spec:
  packageName: '@backstage-community/plugin-rbac'
  # Tag: bs_1.54.9__2.3.1
  dynamicArtifact: "oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-rbac@sha256:7b29e3d0f96437124a72240ead7f83a75edcc85954d7104e8566f4fdd135603d"
  version: 2.3.1
  backstage:
    role: frontend-plugin
    supportedVersions: 1.54.6
  author: Red Hat
  support: generally-available
  lifecycle: active
  partOf:
    - rbac
  appConfigExamples:
    - title: Default configuration
      content:
        dynamicPlugins:
          frontend:
            backstage-community.plugin-rbac:
              translationResources:
                - importName: rbacTranslations
                  ref: rbacTranslationRef
              appIcons:
                - name: rbacIcon
                  importName: RbacIcon
                  module: Legacy
              dynamicRoutes:
                - path: /rbac
                  importName: RbacPage
                  module: Legacy
                  menuItem:
                    icon: rbacIcon
                    text: RBAC
                    textKey: menuItem.rbac
              menuItems:
                rbac:
                  parent: default.admin
                  icon: rbacIcon

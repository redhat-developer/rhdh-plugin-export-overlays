apiVersion: extensions.backstage.io/v1alpha1
kind: Package
metadata:
  name: backstage-plugin-auth-backend-module-gitlab-provider
  namespace: rhdh
  title: "Auth Backend Module GitLab Provider"
  links:
    - url: https://red.ht/rhdh
      title: Homepage
    - url: https://github.com/backstage/backstage/issues
      title: Bugs
    - title: Source Code
      url: https://github.com/backstage/backstage/tree/master/plugins/auth-backend-module-gitlab-provider
  annotations:
    backstage.io/source-location: url:https://github.com/backstage/backstage/tree/master/plugins/auth-backend-module-gitlab-provider
  tags:
    - authentication
spec:
  packageName: "@backstage/plugin-auth-backend-module-gitlab-provider"
  # Tag: bs_1.54.6__0.4.6
  dynamicArtifact: "oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-plugin-auth-backend-module-gitlab-provider@sha256:83ba29609850397ffc97792304fab64982eaf8cac29e48d3d576f3ff2461be4d"
  version: 0.4.6
  backstage:
    role: backend-plugin-module
    supportedVersions: 1.54.6
  author: Red Hat
  support: generally-available
  lifecycle: active
  partOf:
    - backstage-plugin-auth-backend-module-gitlab-provider
  appConfigExamples:
    - title: Default configuration
      content:
        auth:
          providers:
            gitlab:
              production:
                clientId: ${GITLAB_CLIENT_ID}
                clientSecret: ${GITLAB_CLIENT_SECRET}
                signIn:
                  resolvers:
                    - resolver: emailMatchingUserEntityProfileEmail

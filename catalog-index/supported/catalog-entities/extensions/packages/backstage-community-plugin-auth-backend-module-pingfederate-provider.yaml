apiVersion: extensions.backstage.io/v1alpha1
kind: Package
metadata:
  name: backstage-community-plugin-auth-backend-module-pingfederate-provider
  namespace: rhdh
  title: "Auth Backend Module PingFederate Provider"
  links:
    - url: https://red.ht/rhdh
      title: Homepage
    - url: https://github.com/backstage/community-plugins/issues
      title: Bugs
    - title: Source Code
      url: https://github.com/backstage/community-plugins/tree/main/workspaces/pingidentity/plugins/auth-backend-module-pingfederate-provider
  annotations:
    backstage.io/source-location: url:https://github.com/backstage/community-plugins/tree/main/workspaces/pingidentity/plugins/auth-backend-module-pingfederate-provider
  tags:
    - authentication
spec:
  packageName: "@backstage-community/plugin-auth-backend-module-pingfederate-provider"
  # Tag: bs_1.54.9__0.4.0
  dynamicArtifact: "oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-auth-backend-module-pingfederate-provider@sha256:3347e6daffb4cc33ce9ccba4bcdfb63a7a28e6bafdfb40b5ecf80cc0158e412f"
  version: 0.4.0
  backstage:
    role: backend-plugin-module
    supportedVersions: 1.54.9
  author: Red Hat
  support: generally-available
  lifecycle: active
  partOf:
    - backstage-community-plugin-auth-backend-module-pingfederate-provider
  appConfigExamples:
    - title: Default configuration
      content:
        auth:
          providers:
            pingfederate:
              development:
                clientId: ${PINGFEDERATE_CLIENT_ID}
                clientSecret: ${PINGFEDERATE_CLIENT_SECRET}
                baseUrl: ${PINGFEDERATE_BASE_URL}
                signIn:
                  resolvers:
                    - resolver: subClaimMatchingPingIdentityUserId

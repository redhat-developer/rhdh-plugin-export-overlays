apiVersion: extensions.backstage.io/v1alpha1
kind: Package
metadata:
  name: red-hat-developer-hub-backstage-plugin-homepage
  namespace: rhdh
  title: Homepage
  links:
    - url: https://red.ht/rhdh
      title: Homepage
    - url: https://issues.redhat.com/browse/RHDHBUGS
      title: "Report issues here. Note: Customers of Red Hat Developer Hub should raise a Red Hat support case instead."
    - title: Source Code
      url: https://github.com/redhat-developer/rhdh-plugins/tree/main/workspaces/homepage
  annotations:
    backstage.io/source-location: url:https://github.com/redhat-developer/rhdh-plugins/tree/main/workspaces/homepage
  tags: []
spec:
  packageName: '@red-hat-developer-hub/backstage-plugin-homepage'
  # Tag: bs_1.52.0__1.17.0
  dynamicArtifact: "oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-homepage@sha256:9db6538330dbb5a51f233760f9ace9cdc397da3d125b8b83678cc327655e5566"
  version: 1.17.0
  backstage:
    role: frontend-plugin
    supportedVersions: 1.52.0
  author: Red Hat
  support: generally-available
  lifecycle: active
  partOf:
    - home-page
  appConfigExamples:
    - title: Default configuration
      content:
        dynamicPlugins:
          frontend:
            red-hat-developer-hub.backstage-plugin-homepage:
              dynamicRoutes:
                - path: /
                  importName: DynamicHomePage
              mountPoints:
                - mountPoint: home.page/cards
                  importName: OnboardingSection
                  config:
                    layouts:
                      xl: { w: 12, h: 6 }
                      lg: { w: 12, h: 6 }
                      md: { w: 12, h: 7 }
                      sm: { w: 12, h: 8 }
                      xs: { w: 12, h: 9 }
                      xxs: { w: 12, h: 14 }
                - mountPoint: home.page/cards
                  importName: EntitySection
                  config:
                    layouts:
                      xl: { w: 12, h: 7 }
                      lg: { w: 12, h: 7 }
                      md: { w: 12, h: 8 }
                      sm: { w: 12, h: 9 }
                      xs: { w: 12, h: 11 }
                      xxs: { w: 12, h: 15 }
                - mountPoint: home.page/cards
                  importName: TemplateSection
                  config:
                    layouts:
                      xl: { w: 12, h: 5 }
                      lg: { w: 12, h: 5 }
                      md: { w: 12, h: 5 }
                      sm: { w: 12, h: 5 }
                      xs: { w: 12, h: 7.5 }
                      xxs: { w: 12, h: 13.5 }
                - mountPoint: home.page/widgets
                  importName: RecentlyVisitedCard
                  config:
                    title: 'Recently Visited'
                    description: 'Quick access to recently viewed entities and pages'
                    priority: 2
                    layouts:
                      xl: { w: 4, h: 3 }
                      lg: { w: 4, h: 3 }
                      md: { w: 6, h: 3 }
                      sm: { w: 12, h: 3 }
                      xs: { w: 12, h: 3 }
                      xxs: { w: 12, h: 3 }
                - mountPoint: home.page/widgets
                  importName: TopVisitedCard
                  config:
                    title: 'Most Visited'
                    description: 'Your most frequently accessed entities and services'
                    priority: 1
                    layouts:
                      xl: { w: 4, h: 3 }
                      lg: { w: 4, h: 3 }
                      md: { w: 6, h: 3 }
                      sm: { w: 12, h: 3 }
                      xs: { w: 12, h: 3 }
                      xxs: { w: 12, h: 3 }

# Format, lint, type-check, and unit-test the TypeScript workspaces in scripts/.
name: Scripts workspaces

on:
  pull_request:
    branches:
      - main
      - 'release-*'
    paths:
      - 'scripts/**'
      - '.github/workflows/scripts-workspaces.yaml'
  workflow_dispatch:

concurrency:
  group: scripts-workspaces-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: scripts
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          working-directory: scripts
          cache: true

      - name: Check (format, lint, and type-check)
        run: vp check

      - name: Test (unit tests)
        run: vp test --coverage

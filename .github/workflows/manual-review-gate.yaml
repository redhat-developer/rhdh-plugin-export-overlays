name: Manual Review Gate

# Enforces the `requires-manual-review` label as a merge gate (#3525).
# The review agent applies the label to PRs touching protected paths, but
# nothing blocked the merge: this check fails while the label is present
# and no trusted human reviewer (owner, org member, or collaborator) has
# an approving review on the current head commit.
#
# What this check can and cannot guarantee:
#
# - The `pull_request_target` runs (open/reopen/push/label changes)
#   execute this file from the base branch and check out no PR code. The
#   `pull_request_review` runs execute the PR merge ref's copy of this
#   file, and more generally any PR can define a workflow whose job
#   publishes a check under this same name - an Actions-based check
#   cannot by itself resist a deliberately malicious PR.
# - Hard enforcement therefore needs branch protection on `main`: mark
#   the `Require manual review approval` check as required AND require
#   code owner reviews (`.github/CODEOWNERS` already covers
#   `.github/workflows/` through its `*` rule), so a PR that edits or
#   shadows this gate needs a code owner's approval anyway. Until then
#   the check is visible on the PR but merge is not blocked.
# - The label must be applied with GitHub App or user credentials:
#   labels added with a workflow's own GITHUB_TOKEN do not fire the
#   `labeled` trigger. The review agent labels through its App
#   installation, which does.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    name: Require manual review approval
    steps:
      - name: Check for human approval when requires-manual-review is set
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const GATE_LABEL = 'requires-manual-review';
            const pr = context.payload.pull_request;

            // Labels can be stale in pull_request_review payloads, so always
            // read the current state.
            const { data: currentPr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });
            const labels = currentPr.labels.map(label => label.name);

            if (!labels.includes(GATE_LABEL)) {
              console.log(`Label '${GATE_LABEL}' is not present - nothing to gate.`);
              return;
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });

            // Only reviewers the repository actually trusts can satisfy the
            // gate: on a public repository any GitHub account can submit a
            // review. author_association ships with the review payload, so
            // this needs no extra API call or token permission.
            const TRUSTED_ASSOCIATIONS = ['OWNER', 'MEMBER', 'COLLABORATOR'];

            // Track the latest gate-relevant state per trusted human
            // reviewer, mirroring GitHub's own semantics: a COMMENTED review
            // does not revoke an earlier approval, but CHANGES_REQUESTED or
            // a dismissal does. GitHub Apps and `[bot]` accounts are
            // excluded; automation reviewing through a regular machine-user
            // account cannot be told apart from a human here.
            const stateByReviewer = new Map();
            for (const review of reviews) {
              if (
                !review.user ||
                review.user.type === 'Bot' ||
                review.user.login.endsWith('[bot]')
              ) {
                continue;
              }
              if (review.user.login === currentPr.user.login) {
                continue;
              }
              if (!TRUSTED_ASSOCIATIONS.includes(review.author_association)) {
                console.log(
                  `Ignoring review by ${review.user.login} (${review.author_association})`,
                );
                continue;
              }
              if (
                review.state === 'APPROVED' &&
                review.commit_id !== currentPr.head.sha
              ) {
                // Stale approval: it was submitted against an older commit.
                // Ignoring it mirrors the "dismiss stale pull request
                // approvals" branch protection behavior the issue calls for,
                // so pushing new commits after an approval re-opens the gate.
                // CHANGES_REQUESTED is deliberately not aged out the same
                // way: GitHub's own review model keeps a change request
                // active across pushes until it is dismissed or superseded
                // by a newer review from the same reviewer.
                console.log(
                  `Ignoring stale approval by ${review.user.login} on ${review.commit_id}`,
                );
                continue;
              }
              if (['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED'].includes(review.state)) {
                stateByReviewer.set(review.user.login, review.state);
              }
            }

            const approvers = Array.from(stateByReviewer.entries())
              .filter(([, state]) => state === 'APPROVED')
              .map(([login]) => login);

            if (approvers.length > 0) {
              console.log(`Approved by: ${approvers.join(', ')} - gate passes.`);
              return;
            }

            core.setFailed(
              `This PR carries the '${GATE_LABEL}' label but has no approving ` +
                'review on the current commit from a trusted human reviewer ' +
                '(owner, org member, or collaborator). It touches protected ' +
                'paths, so a maintainer must approve it - or approve it again ' +
                'if an earlier approval went stale after new commits.',
            );

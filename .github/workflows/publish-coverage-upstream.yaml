name: Publish E2E coverage upstream

# Publishes a workspace's E2E coverage to the Codecov project of the repository
# the plugin sources live in, where it is browsable file by file. The anchor
# upload (seed-coverage-main.yaml) keeps the per-workspace percentage on THIS
# repo's project and is unaffected; this is the per-file view that the anchor
# cannot give, because this repo does not contain the plugin sources.
#
# Every push to main that touches a workspace publishes that workspace's
# coverage. The manual dispatch is kept for backfilling a specific run.
#
# How a push finds the coverage to publish:
#
#   The input is the Prow run's RAW coverage JSONs, which live in that run's
#   artifacts — not the committed coverage-snapshots/<ws>.lcov, which is already
#   anchor-mapped and has lost the per-file detail this exists to publish.
#
#   The artifact URL is NOT reconstructed from the Prow job id. It is read from
#   the link the e2e bot already posts on the PR, which is exactly where
#   refresh-stale-coverage-snapshots.yaml reads it from. Two parsers now depend
#   on that comment's shape; change them together.
#
#   Only a PASSING run publishes. A failed run still produces coverage JSONs,
#   and they are misleading rather than merely incomplete: the bulk-import run
#   blocked by issue #3106 collected 22% because the tests that exercise the
#   page died before touching it. Publishing that would make a broken run's
#   number the plugin's record upstream.
#
# Where this does NOT reach: a workspace whose source repo has no Codecov
# project. upload-coverage-upstream.sh holds that list (ELIGIBLE_SLUGS) and
# exits 0 for anything else, so community plugins are skipped, not failed.

on:
  push:
    branches: [main]
    # Only a workspace change can carry new coverage. A scripts/ or README
    # change cannot, and re-publishing an unchanged report would add a Codecov
    # session for a measurement nobody took.
    paths:
      - "workspaces/**"
  workflow_dispatch:
    inputs:
      workspace:
        description: Workspace whose coverage to publish (e.g. intelligent-assistant)
        type: string
        required: true
      coverage-url:
        description: >-
          gcsweb URL of the run's .../artifacts/e2e-test-results/coverage/
          listing, from a PASSING e2e run of that workspace
        type: string
        required: true
      dry-run:
        description: >-
          Resolve, clone and remap everything, upload nothing. Needs no upstream
          token, and is the cheapest way to check what a run would publish
          before it publishes it.
        type: boolean
        required: false
        default: false
      pinned-only:
        description: >-
          Upload only to the pinned repo-ref, not to the source repo's
          default-branch HEAD. NOTE: a report uploaded to a historical commit
          has not been observed to change that commit's report, so this does
          NOT give you a copy to review before publishing — see the flag's
          comment in scripts/upload-coverage-upstream.sh.
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  # The push path reads the merged PR behind the pushed commit and that PR's
  # comments, to find the e2e run whose artifacts hold the coverage.
  pull-requests: read

# Two runs uploading the same flag at once would send two reports for one
# measurement. Dispatches serialize per workspace so unrelated backfills do not
# wait on each other; push runs share one group because which workspaces they
# carry is only known after the resolve step, by which point a concurrency
# group can no longer be chosen.
concurrency:
  group: publish-coverage-upstream-${{ inputs.workspace || 'push' }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish coverage upstream
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      # Emits a JSON array of {workspace, coverageUrl}. Empty on a push whose
      # PR never ran e2e, or ran it and failed — both are ordinary, so the job
      # reports and succeeds rather than failing on "nothing to publish".
      - name: Resolve what to publish
        id: resolve
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // Parsing lives in a module so it can be tested without running
            // this workflow — see scripts/tests/test_e2e_comment.py.
            const { E2E_BOT_LOGIN, parsePassedE2eComment } =
              require(`${process.env.GITHUB_WORKSPACE}/scripts/e2e-comment.cjs`);

            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('targets', JSON.stringify([{
                workspace: core.getInput('workspace') || '',
                coverageUrl: core.getInput('coverage-url') || '',
              }]));
              return;
            }

            const { data: prs } = await github.rest.repos
              .listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
              });
            const merged = prs.filter((pr) => pr.merged_at);
            if (merged.length === 0) {
              core.info('No merged PR is associated with this commit — nothing to publish.');
              core.setOutput('targets', '[]');
              return;
            }

            // Keyed by workspace so the LAST passing comment wins. One e2e
            // invocation posts one comment per RHDH version in the matrix, and
            // they measure the same PR-built image, so any of them is the same
            // coverage; taking the last is just a deterministic choice.
            const targets = new Map();
            for (const pr of merged) {
              const comments = await github.paginate(
                github.rest.issues.listComments,
                { owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number, per_page: 100 },
              );
              for (const comment of comments) {
                if (comment.user?.login !== E2E_BOT_LOGIN) continue;

                const { workspace, coverageUrl, reason } =
                  parsePassedE2eComment(comment.body ?? '');
                // not-a-pass is the ordinary case — most bot comments on a PR
                // are failures or reruns — so only the two that mean something
                // is wrong are surfaced.
                if (reason === 'bad-workspace') {
                  core.warning(`PR #${pr.number}: ignoring a comment naming an unusable workspace.`);
                  continue;
                }
                if (reason === 'no-build-log') {
                  core.warning(
                    `PR #${pr.number}: a passing e2e comment carried no build-log URL — ` +
                    "skipping (the bot's comment format may have drifted).",
                  );
                  continue;
                }
                if (reason !== null) continue;

                targets.set(workspace, { workspace, coverageUrl });
              }
            }

            const resolved = [...targets.values()];
            core.info(
              resolved.length
                ? `Publishing: ${resolved.map((t) => t.workspace).join(', ')}`
                : 'No passing e2e run found on the merged PR(s) — nothing to publish.',
            );
            core.setOutput('targets', JSON.stringify(resolved));

      - name: Publish coverage upstream
        env:
          # NOT the same secret as CODECOV_TOKEN. Codecov upload tokens are per
          # project, so publishing to rhdh-plugins needs that project's token,
          # held here under its own name. Without it the script fails fast
          # rather than uploading nothing and reporting success.
          CODECOV_RHDH_PLUGINS_TOKEN: ${{ secrets.CODECOV_RHDH_PLUGINS_TOKEN }}
          # Passed through the environment rather than interpolated into the run
          # block: `${{ ... }}` is substituted into the script text before bash
          # sees it, so a crafted value runs as code. Read as shell variables
          # they stay data.
          TARGETS: ${{ steps.resolve.outputs.targets }}
          INPUT_DRY_RUN: ${{ inputs.dry-run }}
          INPUT_PINNED_ONLY: ${{ inputs.pinned-only }}
        run: |
          set -euo pipefail

          count=$(jq 'length' <<<"$TARGETS")
          if [[ "$count" -eq 0 ]]; then
            echo "Nothing to publish."
            exit 0
          fi

          # One workspace's failure must not cost the others theirs. Collected
          # and re-raised at the end so a red run is still a red run.
          failed=()
          for i in $(seq 0 $((count - 1))); do
            workspace=$(jq -r ".[$i].workspace" <<<"$TARGETS")
            coverage_url=$(jq -r ".[$i].coverageUrl" <<<"$TARGETS")

            args=("$workspace" "$coverage_url")
            if [[ "${INPUT_DRY_RUN:-}" == "true" ]]; then
              args+=("--dry-run")
            fi
            if [[ "${INPUT_PINNED_ONLY:-}" == "true" ]]; then
              args+=("--pinned-only")
            fi

            echo "::group::$workspace"
            if ! ./scripts/upload-coverage-upstream.sh "${args[@]}"; then
              echo "[WARN] $workspace: publish failed — continuing with the rest."
              failed+=("$workspace")
            fi
            echo "::endgroup::"
          done

          if [[ ${#failed[@]} -gt 0 ]]; then
            echo "ERROR: failed to publish: ${failed[*]}" >&2
            exit 1
          fi

name: Release Plugin Sanity

# Boots the real RHDH image of a release in a container with every catalog index plugin
# and every community plugin enabled, and fails when one does not load
# (smoke-tests-native/src/release-sanity.ts). No plugin version is written anywhere:
# the image and index come from a CI chart, community builds from spec.dynamicArtifact.
#
# Triggers:
#   - daily, against the newest CI chart of main and of each branch in
#     RELEASE_BRANCHES; a failure is posted on the release-sanity issue;
#   - `/sanity <chart version>` (e.g. `/sanity 2.2-79-CI`) commented on the issue
#     labelled `release-sanity`, by an org member or collaborator. The result is posted
#     back on the issue.
#
# A chart runs with the harness, exclusions and community metadata of its own branch:
# release-X.Y when that branch exists, main otherwise. Scheduled and comment events only
# run this file from main, so the release branches carry the harness, not the trigger.

on:
  schedule:
    - cron: "0 5 * * *"
  issue_comment:
    types: [created]

permissions:
  contents: read

env:
  # Maintained release branches checked daily besides main. Add a branch when it is cut,
  # drop it at end of life.
  RELEASE_BRANCHES: release-2.1

jobs:
  plan:
    name: plan
    # Every comment in the repo starts this workflow; only /sanity on the labelled
    # issue gets a job. Authorization is checked in a step, so a refusal is answered.
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'issue_comment' &&
       !github.event.issue.pull_request &&
       contains(github.event.issue.labels.*.name, 'release-sanity') &&
       startsWith(github.event.comment.body, '/sanity'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    env:
      ISSUE: ${{ github.event.issue.number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Authorize and parse the command
        id: command
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ github.event.comment.body }}
          ASSOCIATION: ${{ github.event.comment.author_association }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          case "$ASSOCIATION" in
            OWNER | MEMBER | COLLABORATOR) ;;
            *)
              gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" \
                --body "Only organization members and collaborators can run \`/sanity\` (your association: $ASSOCIATION). Members with a private membership may need to make it public."
              exit 1
              ;;
          esac
          body="$(printf '%s' "$BODY" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [[ ! "$body" =~ ^/sanity[[:space:]]+([0-9]+\.[0-9]+-[0-9]+-CI)$ ]]; then
            # shellcheck disable=SC2016 # literal backticks for markdown
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" \
              --body 'Usage: `/sanity <CI chart version>`, for example `/sanity 2.2-79-CI`.'
            exit 1
          fi
          chart="${BASH_REMATCH[1]}"
          ref=main
          if git ls-remote --exit-code --heads "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            "release-${chart%%-*}" > /dev/null; then
            ref="release-${chart%%-*}"
          fi
          echo "target=$(jq -nc --arg ref "$ref" --arg chart "$chart" '{ref: $ref, chart: $chart}')" \
            >> "$GITHUB_OUTPUT"
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" \
            -f content=eyes --silent || true
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" \
            --body "Running the release plugin sanity check for \`$chart\` with the \`$ref\` harness: $RUN_URL"

      - name: List the targets
        id: targets
        env:
          TARGET: ${{ steps.command.outputs.target }}
        run: |
          if [[ -n "$TARGET" ]]; then
            echo "targets=[$TARGET]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # shellcheck disable=SC2086 # word-split the space-separated branch list
          echo "targets=$(printf '%s\n' main $RELEASE_BRANCHES \
            | jq -Rnc '[inputs | {ref: ., chart: ""}]')" >> "$GITHUB_OUTPUT"

  sanity:
    name: release-plugin-sanity (${{ matrix.target.ref }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    # One check per branch at a time, queued rather than cancelled.
    concurrency:
      group: release-plugin-sanity-${{ matrix.target.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      issues: write
    env:
      ISSUE: ${{ github.event.issue.number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ matrix.target.ref }}
          persist-credentials: false

      - name: Enable Corepack
        # Before setup-node so its yarn-cache detection resolves Yarn 4 via corepack.
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install the harness
        working-directory: smoke-tests-native
        run: yarn install --immutable --mode=skip-build

      - name: Run the release plugin sanity check
        id: sanity
        working-directory: smoke-tests-native
        env:
          CHART: ${{ matrix.target.chart }}
          REF: ${{ matrix.target.ref }}
        run: |
          # --out must stay inside the working directory (the harness's path rule).
          args=(--out release-sanity-out --run-url "$RUN_URL")
          if [[ -n "$CHART" ]]; then
            args+=(--chart-version "$CHART")
          elif [[ "$REF" == release-* ]]; then
            args+=(--stream "${REF#release-}")
          fi
          # main's metadata builds the newest stream only.
          if [[ "$REF" == main ]]; then args+=(--only-newest-stream); fi
          yarn release-sanity "${args[@]}"

      - name: Publish the result
        # always(): a timeout or cancellation still owes the commenter an answer.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.sanity.outcome }}
        run: |
          OUT=smoke-tests-native/release-sanity-out
          mkdir -p "$OUT"
          summary="$OUT/summary.md"
          if [[ ! -s "$summary" ]]; then
            printf '### Release plugin sanity: %s\n\nThe check did not produce a report: %s\n' \
              "${OUTCOME:-error}" "$RUN_URL" > "$summary"
          fi
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          if [[ -z "$ISSUE" && "$OUTCOME" != "success" ]]; then
            # A scheduled run has no comment to answer; report failures on the issue.
            ISSUE="$(gh issue list --repo "$GITHUB_REPOSITORY" --label release-sanity \
              --state open --limit 1 --json number --jq '.[0].number // empty')"
          fi
          if [[ -n "$ISSUE" ]]; then
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$summary"
          fi

      - name: Upload the report and container log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-plugin-sanity-${{ matrix.target.ref }}
          path: |
            smoke-tests-native/release-sanity-out/*.json
            smoke-tests-native/release-sanity-out/*.md
            smoke-tests-native/release-sanity-out/*.log
            smoke-tests-native/release-sanity-out/*.yaml
            smoke-tests-native/release-sanity-out/config/
          if-no-files-found: ignore
          retention-days: 14

name: Label stale PRs and issues

on:
  schedule:
    - cron: "30 1 * * *" # Runs daily at 1:30 AM UTC

jobs:
  stale:
    runs-on: ubuntu-latest

    permissions:
      issues: write
      pull-requests: write

    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-issue-stale: 21
          days-before-issue-close: 42 # 2 sprints
          stale-issue-label: "stale"
          stale-issue-message: "This issue has been automatically marked as stale due to inactivity."
          close-issue-message: "Closing this issue due to prolonged inactivity. Feel free to reopen if it becomes relevant again."
          exempt-issue-labels: "never-stale"
          days-before-pr-stale: 21
          days-before-pr-close: 42 # 2 sprints
          stale-pr-label: "stale"
          stale-pr-message: "This pull request has been automatically marked as stale due to inactivity."
          close-pr-message: "Closing this pull request due to prolonged inactivity. Feel free to reopen if work resumes."
          exempt-pr-labels: "never-stale,help wanted to test"

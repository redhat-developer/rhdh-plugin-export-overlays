name: Validate appConfigExamples

on:
  pull_request:
    branches:
      - main
      - 'release-*'
    paths:
      - 'workspaces/**/metadata/**'
      - 'scripts/validate-app-config-examples/**'
      - '.github/workflows/validate-app-config-examples.yaml'
  workflow_dispatch:
    inputs:
      check-schemas:
        description: 'Also validate examples against each plugin config schema'
        type: boolean
        default: true

concurrency:
  group: validate-app-config-examples-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: appConfigExamples coverage
    runs-on: ubuntu-latest
    # Schema validation downloads one published tarball per distinct
    # packageName@version, so a full-tree run is far slower than the
    # structural-only check this workflow used to run.
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: scripts/validate-app-config-examples
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      # Before setup-node, so its yarn-cache detection resolves Yarn 4 through
      # corepack rather than the bundled Yarn 1.
      - name: Enable corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: scripts/validate-app-config-examples/yarn.lock

      # skip-build keeps dependency lifecycle scripts from running at install
      # time. Nothing here needs them — esbuild ships its platform binary as an
      # optional dependency rather than fetching one in a postinstall — and
      # .yarnrc.yml sets enableScripts: false so local installs match.
      - name: Install dependencies
        run: yarn install --immutable --mode=skip-build

      - name: Build
        run: yarn build

      - name: Check types and unit tests
        run: yarn check

      # The PR step below runs `--since`, which by construction sees no metadata
      # when a PR only touches this directory — so a change to the validator
      # itself would otherwise ship without the semantic path executing once.
      # This exercises it against a known workspace whose package publishes a
      # compiled config.schema.json. Warn-only: it is a smoke check of the tool,
      # not a verdict on metadata the author did not touch.
      - name: Smoke-check the schema path against known metadata
        if: github.event_name == 'pull_request'
        env:
          SAMPLE: workspaces/adoption-insights/metadata
        run: |
          sha="$(git -C ../.. log -1 --format=%H -- "$SAMPLE")"
          if [[ -z "$sha" ]]; then
            # Empty means the sample path has no reachable history — it was
            # renamed or removed, or the clone is too shallow to reach it.
            # Failing here beats passing a bare "~1" to git, which aborts with
            # an error that says nothing about the real cause.
            echo "No history for $SAMPLE — update the sample path in this step." >&2
            exit 1
          fi
          echo "Exercising the schema path against $SAMPLE since ${sha}~1"
          node dist/validate.mjs --check-schemas --warn-only --since "${sha}~1"

      # A full-tree sweep reports schema mismatches without failing: the tree
      # carries metadata written long before this check existed, and the sweep
      # is meant to surface that backlog rather than block on it.
      - name: Validate (full tree)
        if: github.event_name == 'workflow_dispatch'
        env:
          CHECK_SCHEMAS: ${{ inputs.check-schemas }}
        run: |
          args=()
          if [[ "$CHECK_SCHEMAS" == "true" ]]; then
            args+=(--check-schemas --warn-only)
          fi
          node dist/validate.mjs "${args[@]}"

      # On a PR only the metadata the author just touched is validated, so a
      # mismatch here is something they introduced and can act on. Blocking is
      # fair, and keeps the check from being advisory-only forever.
      - name: Validate (PR — changed metadata only)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node dist/validate.mjs --since "$BASE_SHA" --check-schemas

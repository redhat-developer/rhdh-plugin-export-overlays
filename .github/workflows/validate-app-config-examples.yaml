name: Validate appConfigExamples

on:
  pull_request:
    branches:
      - main
      - 'release-*'
    paths:
      - 'workspaces/**/metadata/**'
      - 'scripts/validate-app-config-examples/**'
      - '.github/workflows/validate-app-config-examples.yaml'
  workflow_dispatch:

concurrency:
  group: validate-app-config-examples-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: appConfigExamples coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: scripts/validate-app-config-examples
        run: |
          corepack enable
          yarn install --immutable

      - name: Build
        working-directory: scripts/validate-app-config-examples
        run: yarn build

      - name: Check types and unit tests
        working-directory: scripts/validate-app-config-examples
        run: yarn check

      - name: Validate (full tree)
        if: github.event_name == 'workflow_dispatch'
        working-directory: scripts/validate-app-config-examples
        run: node dist/validate.mjs

      - name: Validate (PR — changed metadata only)
        if: github.event_name == 'pull_request'
        working-directory: scripts/validate-app-config-examples
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node dist/validate.mjs --since "$BASE_SHA"

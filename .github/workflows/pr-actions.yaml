name: Pull Request Actions
on:
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      pr-number:
        description: PR number to act on
        type: string
        required: true
      command-name:
        description: Command to execute (publish, update-versions, update-commit, smoketest, override-backstage)
        type: string
        required: true
      smoketest-tag:
        description: Optional RHDH tag override for `/smoketest <tag>`
        type: string
        required: false

jobs:
  parse:
    runs-on: ubuntu-latest
    name: Parse PR Comment
    if: >
      github.event_name == 'workflow_dispatch' || (
      github.triggering_actor != 'openshift-ci[bot]' &&
      github.triggering_actor != 'sonarqubecloud[bot]' &&
      github.event.issue.pull_request && (
      contains(github.event.comment.body, '/publish') ||
      contains(github.event.comment.body, '/update-versions') ||
      contains(github.event.comment.body, '/update-commit') ||
      contains(github.event.comment.body, '/smoketest') ||
      contains(github.event.comment.body, '/override-backstage')))

    outputs:
      command-name: ${{ steps.extract.outputs.command-name }}
      error-message: ${{ steps.extract.outputs.error-message }}
      pr-number: ${{ steps.extract.outputs.pr-number }}
      smoketest-tag: ${{ steps.extract.outputs.smoketest-tag }}
    steps:
      - name: Extract command from comment
        id: extract
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const SMOKETEST_TAG_RE = /^(?:pr-[0-9]+(?:-[0-9a-f]{7,40})?|next(?:-[0-9]+\.[0-9]+-[0-9a-f]{7,40}|-[0-9a-f]{7,40})?)$/;
            const SMOKETEST_HELP = 'Use /smoketest or /smoketest <tag>. Allowed tags: pr-<digits>, pr-<digits>-<hash>, next, next-<major>.<minor>-<hash>, next-<hash>.';
            core.setOutput('smoketest-tag', '');
            if (context.eventName === 'workflow_dispatch') {
              const commandName = '${{ inputs.command-name }}';
              const allowed = new Set(['publish', 'update-versions', 'update-commit', 'smoketest', 'override-backstage']);
              if (!allowed.has(commandName)) {
                const errorMsg = `Invalid command: ${commandName}`;
                core.setOutput('error-message', errorMsg);
                core.setOutput('command-name', '');
                core.setFailed(errorMsg);
                return;
              }
              core.setOutput('command-name', commandName);
              core.setOutput('error-message', '');
              core.setOutput('pr-number', '${{ inputs.pr-number }}');
              const smoketestTag = String('${{ inputs.smoketest-tag }}').trim();
              if (smoketestTag !== '' && commandName !== 'smoketest') {
                const errorMsg = 'Input smoketest-tag is only valid with command-name=smoketest.';
                core.setOutput('error-message', errorMsg);
                core.setOutput('command-name', '');
                core.setFailed(errorMsg);
                return;
              }
              if (commandName === 'smoketest') {
                if (smoketestTag !== '' && !SMOKETEST_TAG_RE.test(smoketestTag)) {
                  const errorMsg = `Invalid smoketest tag: ${smoketestTag}. ${SMOKETEST_HELP}`;
                  core.setOutput('error-message', errorMsg);
                  core.setOutput('command-name', '');
                  core.setFailed(errorMsg);
                  return;
                }
                core.setOutput('smoketest-tag', smoketestTag);
              }
              return;
            }
            core.setOutput('pr-number', String(context.issue.number));
            const raw = context.payload.comment?.body ?? '';
            const lines = String(raw)
              .split(/\r?\n/)
              .map(l => l.trim())
              .filter(l => l.length > 0);
            const allowed = new Set(['/publish', '/update-versions', '/update-commit', '/override-backstage']);
            const matchingCommands = [];
            let smoketestTag = '';
            let malformedSmoketestCommand = '';
            for (const line of lines) {
              if (allowed.has(line)) {
                matchingCommands.push(line);
                continue;
              }
              if (line.startsWith('/smoketest')) {
                const smoketestMatch = line.match(/^\/smoketest(?:\s+(\S+))?$/);
                if (!smoketestMatch) {
                  malformedSmoketestCommand = line;
                  break;
                }
                const parsedTag = smoketestMatch[1] ?? '';
                if (parsedTag !== '' && !SMOKETEST_TAG_RE.test(parsedTag)) {
                  malformedSmoketestCommand = line;
                  break;
                }
                matchingCommands.push('/smoketest');
                smoketestTag = parsedTag;
              }
            }
            if (malformedSmoketestCommand) {
              const errorMsg = `Invalid smoketest command: "${malformedSmoketestCommand}". ${SMOKETEST_HELP}`;
              core.setOutput('error-message', errorMsg);
              core.setOutput('command-name', '');
              core.setFailed(errorMsg);
              return;
            }

            if (matchingCommands.length > 1) {
              const errorMsg = `Multiple commands found in comment: ${matchingCommands.join(', ')}. Please use only one command per comment.`;
              core.setOutput('error-message', errorMsg);
              core.setOutput('command-name', '');
              core.setFailed(errorMsg);
              return;
            }
            if (matchingCommands.length === 0) {
              core.notice('No command found in comment – cancelling workflow run');
              await github.rest.actions.cancelWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
              });
              return;
            }

            const firstMatching = matchingCommands[0] || '';
            core.setOutput('command-name', firstMatching.startsWith('/') ? firstMatching.slice(1) : firstMatching);
            core.setOutput('smoketest-tag', firstMatching === '/smoketest' ? smoketestTag : '');
            core.setOutput('error-message', '');

  add_error_comment:
    needs:
      - parse

    concurrency:
      group: add_error_comment-${{ github.ref_name }}-${{ needs.parse.outputs.pr-number }}
      cancel-in-progress: false

    permissions:
      pull-requests: write

    if: always() && needs.parse.outputs.error-message != ''
    runs-on: ubuntu-latest
    steps:
      - name: Add error comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUT_ERROR_MESSAGE: ${{ needs.parse.outputs.error-message }}
          INPUT_PR_NUMBER: ${{ needs.parse.outputs.pr-number }}
        with:
          script: |
            const errorMessage = core.getInput('error_message');
            const prNumber = Number(core.getInput('pr_number'));
            const body = `**Error**: ${errorMessage}\n\nValid commands are:\n- \`/publish\` - Publish dynamic plugin images\n- \`/update-versions\` - Update versions from release branch\n- \`/update-commit\` - Update commit from automatic discovery\n- \`/override-backstage\` - Override Backstage version compatibility\n- \`/smoketest\` - Run smoke tests with default image\n- \`/smoketest <tag>\` - Run smoke tests with \`quay.io/rhdh-community/rhdh:<tag>\`\n  - Allowed tags: \`pr-4907\`, \`pr-4929-90eff067\`, \`next\`, \`next-1.10-244a2755\`, \`next-8a0d43e7\``;
            await github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  prepare:
    runs-on: ubuntu-latest
    name: Prepare
    needs:
      - parse

    concurrency:
      group: prepare-${{ github.ref_name }}-${{ needs.parse.outputs.pr-number }}
      cancel-in-progress: false

    if: needs.parse.outputs.command-name != ''
    outputs:
      target-branch: ${{ steps.get-branch.outputs.target-branch }}
      overlay-branch: ${{ steps.get-branch.outputs.overlay-branch }}
      overlay-repo: ${{ steps.get-branch.outputs.overlay-repo }}
      overlay-commit: ${{ steps.get-branch.outputs.overlay-commit }}
      workspace: ${{ steps.get-branch.outputs.workspace }}
      pr-number: ${{ steps.get-branch.outputs.pr-number }}
      rhdh-tag: ${{ needs.parse.outputs.smoketest-tag }}

    permissions:
      statuses: write

    steps:
      - name: Get PR branch data
        id: get-branch
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUT_COMMAND_NAME: ${{ needs.parse.outputs.command-name }}
          INPUT_PR_NUMBER: ${{ needs.parse.outputs.pr-number }}
        with:
          script: |
            const prNumber = Number(core.getInput('pr_number'));
            const currentPullRequest = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            const targetBranch = currentPullRequest.data.base.ref;
            core.setOutput('target-branch', targetBranch);
            const prBranch = currentPullRequest.data.head.ref;
            core.setOutput('overlay-branch', prBranch);
            const prRepo = currentPullRequest.data.head.repo.full_name;
            core.setOutput('overlay-repo', prRepo);
            core.setOutput('pr-number', prNumber);
            const prCommit = currentPullRequest.data.head.sha;
            core.setOutput('overlay-commit', prCommit);
            let workspace = '';

            const matches = prBranch.match(/^workspaces\/release-.+__(.+)$/);
            if (matches && matches.length == 2) {
              workspace = `workspaces/${matches[1]}`;
            } else {
              const prFiles = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                per_page: 100,
              });
              const workspaces = [ ... new Set(prFiles
                .map(f => f.filename.match(/^workspaces\/([^\/]+)\/.*/))
                .filter(match => match)
                .map(match => match[1])
              )];
              if (workspaces.length === 1) {
                workspace =`workspaces/${workspaces[0]}`;
              }
            }
            core.setOutput('workspace', workspace);
            if (workspace === '') {
              return;
            }

            const workflowRun = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: '${{ github.run_id }}',
            });
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: prCommit,
              description: '${{ github.workflow }}',
              state: 'pending',
              target_url: workflowRun.data.html_url,
              context: core.getInput('command_name')
            });

  publish:
    name: Publish PR
    needs:
      - parse
      - prepare

    concurrency:
      group: publish-${{ github.ref_name }}-${{ needs.parse.outputs.pr-number }}
      cancel-in-progress: true

    if: |
      needs.parse.outputs.command-name == 'publish' &&
      needs.prepare.outputs.workspace != ''
    uses: ./.github/workflows/auto-publish-pr.yaml
    with:
      pr-number: ${{ needs.prepare.outputs.pr-number }}
    permissions:
      contents: write
      attestations: write
      packages: write
      id-token: write
      statuses: write
      pull-requests: write

  prepare_smoke_tests:
    name: Prepare Smoke Tests
    needs:
      - parse
      - prepare
      - publish
    if: >-
      always() &&
      needs.prepare.outputs.workspace != '' &&
      ((needs.parse.outputs.command-name == 'publish' &&
        needs.publish.result == 'success' &&
        needs.publish.outputs.only-metadata-changed != 'true') ||
       needs.parse.outputs.command-name == 'smoketest')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      statuses: write
    outputs:
      has-runnable-plugins: ${{ steps.build-dynamic-plugins.outputs.has-runnable-plugins }}
      skip-tests-missing-env: ${{ steps.build-dynamic-plugins.outputs.skip-tests-missing-env }}
      missing-metadata-plugins: ${{ steps.build-dynamic-plugins.outputs.missing-metadata-plugins }}
    steps:
      - name: Set pending commit status
        if: needs.prepare.outputs.pr-number != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          OVERLAY_COMMIT: ${{ needs.prepare.outputs.overlay-commit }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr-number }}
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const overlayCommit = process.env.OVERLAY_COMMIT;
            const pr = Number(process.env.PR_NUMBER);
            if (!pr || !overlayCommit) {
              console.log('Missing PR or commit; skipping pending status');
              return;
            }
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: overlayCommit,
              description: 'Workspace Smoke Tests',
              state: 'pending',
              target_url: runUrl,
              context: 'smoketest',
            });
            console.log(`Set pending status on ${overlayCommit}`);

      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.overlay-branch }}
          repository: ${{ needs.prepare.outputs.overlay-repo }}

      - name: Download published-exports artifact from publish job
        if: needs.parse.outputs.command-name == 'publish'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: published-exports-pr-${{ needs.prepare.outputs.pr-number }}
          path: ./published-exports

      - name: Download published-exports artifact for this PR
        if: needs.parse.outputs.command-name == 'smoketest'
        uses: dawidd6/action-download-artifact@57aa996fc1713cc1579039614f4645a7f4841fd4 # v23
        with:
          name: published-exports-pr-${{ needs.prepare.outputs.pr-number }}
          workflow: pr-actions.yaml
          workflow_conclusion: success
          workflow_search: true
          search_artifacts: true
          path: ./published-exports
          if_no_artifact_found: fail

      - name: Build dynamic-plugins.test.yaml
        id: build-dynamic-plugins
        env:
          WORKSPACE_PATH: ${{ needs.prepare.outputs.workspace }}
          INPUT_PUBLISHED_EXPORTS: ${{ needs.publish.outputs.published-exports || '' }}
        run: |
          PLUGINS_FOUND=0
          PLUGINS_SKIPPED_MISSING_METADATA=0
          PLUGINS_SKIPPED_MISSING_ENV=0
          TEST_PLUGINS_SKIPPED=0
          TOTAL_PLUGINS=0
          HAS_RUNNABLE_PLUGINS="false"
          SKIP_TESTS_MISSING_ENV="false"
          MISSING_METADATA_PLUGINS=()

          PUBLISHED_EXPORTS="${INPUT_PUBLISHED_EXPORTS:-}"
          if [ -z "$PUBLISHED_EXPORTS" ]; then
            EXPORTS_FILE=""
            if [[ -f "./published-exports/published-exports.txt" ]]; then
              EXPORTS_FILE="./published-exports/published-exports.txt"
            elif [[ -f "./published-exports/published-exports/published-exports.txt" ]]; then
              EXPORTS_FILE="./published-exports/published-exports/published-exports.txt"
            elif [[ -f "./published-exports.txt" ]]; then
              EXPORTS_FILE="./published-exports.txt"
            fi
            if [[ -n "$EXPORTS_FILE" && -f "$EXPORTS_FILE" ]]; then
              PUBLISHED_EXPORTS=$(cat "$EXPORTS_FILE")
            fi
          fi

          if [ -z "$PUBLISHED_EXPORTS" ]; then
            echo "No published exports provided."
            echo "has-runnable-plugins=$HAS_RUNNABLE_PLUGINS" >> "$GITHUB_OUTPUT"
            echo "skip-tests-missing-env=$SKIP_TESTS_MISSING_ENV" >> "$GITHUB_OUTPUT"
            echo "missing-metadata-plugins<<EOF" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TOTAL_PLUGINS=$(echo $PUBLISHED_EXPORTS | wc -w)

          OUT_DIR="$WORKSPACE_PATH/smoke-tests"
          OUT_FILE="$OUT_DIR/dynamic-plugins.test.yaml"
          mkdir -p "$OUT_DIR"

          # Build map of <stripped packageName> -> metadata file path
          declare -A META_MAP
          for file in "$WORKSPACE_PATH"/metadata/*.yaml; do
            [ -e "$file" ] || continue
            pkg=$(yq -r '.spec.packageName // ""' "$file")
            if [ -n "$pkg" ] && [ "$pkg" != "null" ]; then
              stripped=$(echo "$pkg" | sed 's|^@||; s|/|-|')
              META_MAP["$stripped"]="$file"
            fi
          done

          # Always include the root-level default config
          ROOT_CONFIG="$GITHUB_WORKSPACE/smoke-tests/app-config.yaml"
          [ -f "$ROOT_CONFIG" ] && cp "$ROOT_CONFIG" "$OUT_DIR/app-config.yaml"

          # Read workspace-wide test.env if it exists
          WORKSPACE_ENV_FILE="$WORKSPACE_PATH/smoke-tests/test.env"
          WORKSPACE_ENV_CONTENT=""
          if [ -f "$WORKSPACE_ENV_FILE" ]; then
            echo "Found workspace test.env file: $WORKSPACE_ENV_FILE"
            WORKSPACE_ENV_CONTENT=$(cat "$WORKSPACE_ENV_FILE")
          else
            echo "No workspace test.env file found at: $WORKSPACE_ENV_FILE"
          fi

          # Start the resulting YAML file
          echo "plugins:" > "$OUT_FILE"

          # For each published export, extract plugin name and read its metadata
          # Expected export format: ghcr.io/<repo_path>/<plugin_name>:<tag>
          for export in $PUBLISHED_EXPORTS; do
            if [[ "$export" =~ ^ghcr\.io/(.+):([^[:space:]]+)$ ]]; then
              IMAGE_PATH_AND_PLUGIN="${BASH_REMATCH[1]}"   # <repo_path>/<plugin_name>
              NEW_TAG="${BASH_REMATCH[2]}"                 # <tag>
              PLUGIN_NAME="${IMAGE_PATH_AND_PLUGIN##*/}"
              METADATA_FILE="${META_MAP[$PLUGIN_NAME]}"
              if [ -z "$METADATA_FILE" ]; then
                # if the name of the plugin ends with -test, it is a test plugin without metadata:
                # skip it without cancelling the test workflow
                if [[ "$PLUGIN_NAME" =~ -test$ ]]; then
                  echo "Plugin $PLUGIN_NAME is a test plugin without metadata, skipping this individual plugin test"
                  TEST_PLUGINS_SKIPPED=$((TEST_PLUGINS_SKIPPED + 1))
                else
                  echo "Metadata mapping not found for $PLUGIN_NAME: skipping this plugin"
                  PLUGINS_SKIPPED_MISSING_METADATA=$((PLUGINS_SKIPPED_MISSING_METADATA + 1))
                  MISSING_METADATA_PLUGINS+=("$PLUGIN_NAME")
                fi
                continue
              fi

              PACKAGE_NAME=$(yq -r '.spec.packageName' "$METADATA_FILE")
              if [ -z "$PACKAGE_NAME" ] || [ "$PACKAGE_NAME" = "null" ]; then
                echo "spec.packageName not found in $METADATA_FILE, skipping"
                PLUGINS_SKIPPED_MISSING_METADATA=$((PLUGINS_SKIPPED_MISSING_METADATA + 1))
                MISSING_METADATA_PLUGINS+=("$PLUGIN_NAME")
                continue
              fi

              # npm-style package name with scope/path → image-style id (matches OCI image basename)
              STRIPPED=$(echo "$PACKAGE_NAME" | sed 's|^@||; s|/|-|')
              # Published export tags may still include a legacy `!<stripped package id>` suffix; drop it when present
              OCI_TAG="${NEW_TAG%"!${STRIPPED}"}"

              # First appConfigExamples item is used for testing
              CONFIG_CONTENT=$(yq -o=yaml '.spec.appConfigExamples[0].content' "$METADATA_FILE" 2>/dev/null || echo "")
              if [ -z "$CONFIG_CONTENT" ] || [ "$CONFIG_CONTENT" = "null" ]; then
                echo "spec.appConfigExamples[0].content not found in $METADATA_FILE: assuming empty config"
                CONFIG_CONTENT=""
              fi

              ENV_VARS=$(echo "$CONFIG_CONTENT" | yq -o=yaml '.dynamicPlugins' 2>/dev/null | grep -oE '\$\{[A-Z_][A-Z0-9_]*\}|\$[A-Z_][A-Z0-9_]*' | sed 's/\${//; s/}//; s/^\$//' | sort -u || true)

              if [ -n "$ENV_VARS" ]; then
                # Config contains environment variables
                if [ -z "$WORKSPACE_ENV_CONTENT" ]; then
                  echo "::warning::Config for $PLUGIN_NAME contains environment variables but workspace test.env is missing. Tests will be skipped."
                  SKIP_TESTS_MISSING_ENV="true"
                  PLUGINS_SKIPPED_MISSING_ENV=$((PLUGINS_SKIPPED_MISSING_ENV + 1))
                  continue
                else
                  # Validate all ENVs are present in workspace test.env
                  MISSING_ENVS=()
                  while IFS= read -r env_var; do
                    [ -z "$env_var" ] && continue
                    if ! echo "$WORKSPACE_ENV_CONTENT" | grep -qE "^[[:space:]]*${env_var}[[:space:]]*="; then
                      MISSING_ENVS+=("$env_var")
                    fi
                  done <<< "$ENV_VARS"

                  if [ ${#MISSING_ENVS[@]} -gt 0 ]; then
                    echo "::error::Environment variables missing from test.env: ${MISSING_ENVS[*]}"
                    echo "Config for $PLUGIN_NAME references these environment variables but they are not defined in $WORKSPACE_ENV_FILE."
                    exit 1
                  fi
                fi
              fi
              # If no ENVs in config, continue regardless of env file existence

              echo "- package: \"oci://ghcr.io/${IMAGE_PATH_AND_PLUGIN}:${OCI_TAG}\"" >> "$OUT_FILE"
              echo "  enabled: true" >> "$OUT_FILE"
              if [ -n "$CONFIG_CONTENT" ]; then
                echo "  pluginConfig:" >> "$OUT_FILE"
                echo "$CONFIG_CONTENT" | sed 's/^/    /' >> "$OUT_FILE"
              fi
              PLUGINS_FOUND=$((PLUGINS_FOUND + 1))
            else
              echo "Export did not match expected format, skipping: $export"
            fi
          done

          if [ "$PLUGINS_FOUND" -eq 0 ]; then
            echo "plugins: []" > "$OUT_FILE"
          else
            HAS_RUNNABLE_PLUGINS="true"
          fi

          echo "Plugins: $PLUGINS_FOUND/$TOTAL_PLUGINS processed successfully"
          [ "${PLUGINS_SKIPPED_MISSING_METADATA:-0}" -gt 0 ] && echo "Skipped $PLUGINS_SKIPPED_MISSING_METADATA (missing runnable metadata)"
          [ "${PLUGINS_SKIPPED_MISSING_ENV:-0}" -gt 0 ] && echo "Skipped $PLUGINS_SKIPPED_MISSING_ENV (missing test.env)"
          [ "${TEST_PLUGINS_SKIPPED:-0}" -gt 0 ] && echo "Skipped $TEST_PLUGINS_SKIPPED test plugin(s) without metadata"
          if [ "${PLUGINS_SKIPPED_MISSING_METADATA:-0}" -gt 0 ]; then
            echo "Some published plugins were skipped because they do not have runnable metadata."
          fi

          echo "has-runnable-plugins=$HAS_RUNNABLE_PLUGINS" >> "$GITHUB_OUTPUT"
          echo "skip-tests-missing-env=$SKIP_TESTS_MISSING_ENV" >> "$GITHUB_OUTPUT"
          echo "missing-metadata-plugins<<EOF" >> "$GITHUB_OUTPUT"
          printf "%s\n" "${MISSING_METADATA_PLUGINS[@]}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Upload smoke test artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-test-artifacts
          path: ${{ format('{0}/smoke-tests', needs.prepare.outputs.workspace) }}
          if-no-files-found: error

      - name: Write workflow summary
        if: needs.prepare.outputs.pr-number != ''
        env:
          WORKSPACE: ${{ needs.prepare.outputs.workspace }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr-number }}
          OVERLAY_REPO: ${{ needs.prepare.outputs.overlay-repo }}
          OVERLAY_BRANCH: ${{ needs.prepare.outputs.overlay-branch }}
        run: |
          {
            if [[ -n "$PR_NUMBER" && "$PR_NUMBER" != "null" ]]; then
              if [[ -n "$WORKSPACE" ]]; then
                echo "Testing [PR #${PR_NUMBER}](https://github.com/${OVERLAY_REPO}/pull/${PR_NUMBER}) in [\`${WORKSPACE}\`](https://github.com/${OVERLAY_REPO}/tree/${OVERLAY_BRANCH}/${WORKSPACE})"
              else
                echo "Testing [PR #${PR_NUMBER}](https://github.com/${OVERLAY_REPO}/pull/${PR_NUMBER}) (no workspace)"
              fi
            else
              echo "No PR context available"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  run_smoke_tests:
    name: Run Smoke Tests
    needs:
      - prepare
      - prepare_smoke_tests
    if: >-
      needs.prepare_smoke_tests.outputs.has-runnable-plugins == 'true' &&
      needs.prepare_smoke_tests.outputs.skip-tests-missing-env != 'true'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/run-workspace-smoke-tests.yaml
    with:
      target-branch: ${{ needs.prepare.outputs.target-branch }}
      rhdh-tag: ${{ needs.prepare.outputs.rhdh-tag }}
      workspace: ${{ needs.prepare.outputs.workspace }}

  add_skipped_smoke_comment:
    name: Add Skipped Smoke Comment
    if: >-
      always() &&
      needs.prepare.outputs.workspace != '' &&
      ((needs.parse.outputs.command-name == 'publish' &&
        needs.publish.result == 'success' &&
        needs.publish.outputs.only-metadata-changed == 'true') ||
       (needs.prepare_smoke_tests.result == 'success' &&
        (needs.prepare_smoke_tests.outputs.has-runnable-plugins != 'true' ||
         needs.prepare_smoke_tests.outputs.skip-tests-missing-env == 'true')))
    needs:
      - parse
      - prepare
      - publish
      - prepare_smoke_tests
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
      statuses: write
    steps:
      - name: Report skipped tests
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          OVERLAY_COMMIT: ${{ needs.prepare.outputs.overlay-commit }}
          INPUT_WORKSPACE: ${{ needs.prepare.outputs.workspace }}
          INPUT_HAS_RUNNABLE_PLUGINS: ${{ needs.prepare_smoke_tests.outputs.has-runnable-plugins || '' }}
          INPUT_SKIP_TESTS_MISSING_ENV: ${{ needs.prepare_smoke_tests.outputs.skip-tests-missing-env || '' }}
          INPUT_MISSING_METADATA_PLUGINS: ${{ needs.prepare_smoke_tests.outputs.missing-metadata-plugins || '' }}
          INPUT_PR_NUMBER: ${{ needs.prepare.outputs.pr-number }}
          INPUT_ONLY_METADATA_CHANGED: ${{ needs.publish.outputs.only-metadata-changed || 'false' }}
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const overlayCommit = process.env.OVERLAY_COMMIT;
            const pr = Number(process.env.INPUT_PR_NUMBER || '0');
            const hasRunnablePlugins = process.env.INPUT_HAS_RUNNABLE_PLUGINS === 'true';
            const skipTestsMissingEnv = process.env.INPUT_SKIP_TESTS_MISSING_ENV === 'true';
            const onlyMetadataChanged = process.env.INPUT_ONLY_METADATA_CHANGED === 'true';
            const missingMetadataPlugins = (process.env.INPUT_MISSING_METADATA_PLUGINS || '').trim();

            let statusDescription = 'Skipped';
            let commentDetail = ' skipped for an unknown reason. Check workflow run for details.\n';
            let summaryDetail = 'Unknown reason. Check workflow run for details.';

            if (onlyMetadataChanged) {
              statusDescription = 'Skipped: metadata-only change';
              commentDetail = ' skipped: PR modified only metadata files (dynamic export was bypassed).\n';
              summaryDetail = 'PR modified only metadata files (dynamic export was bypassed).';
            } else if (skipTestsMissingEnv) {
              statusDescription = 'Skipped: missing smoke-tests/test.env';
              commentDetail = ' skipped: missing workspace `smoke-tests/test.env` file.\n';
              summaryDetail = 'Missing workspace `smoke-tests/test.env` file.';
            } else if (!hasRunnablePlugins) {
              statusDescription = 'Skipped: no runnable plugin metadata';
              commentDetail = ' skipped: no published plugins in this workspace have runnable metadata entries.\n';
              summaryDetail = 'No published plugins in this workspace have runnable metadata entries.';
            }

            if (missingMetadataPlugins) {
              commentDetail += `\nPublished plugins skipped due to missing runnable metadata:\n\`\`\`\n${missingMetadataPlugins}\n\`\`\`\n`;
              summaryDetail += `\n\nPublished plugins skipped due to missing runnable metadata:\n${missingMetadataPlugins}`;
            }

            if (overlayCommit) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: overlayCommit,
                description: statusDescription,
                state: 'success',
                target_url: runUrl,
                context: 'smoketest',
              });
              console.log(`Set success status on ${overlayCommit} (${statusDescription})`);
            }

            if (pr && !onlyMetadataChanged) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr,
                body: `:warning: \n[Smoke test workflow](${runUrl})${commentDetail}`,
              });
            }

            await core.summary
              .addRaw('\n### Tests Skipped\n\n' + summaryDetail)
              .write();

  add_smoke_test_result_comment:
    name: Add Smoke Test Result Comment
    if: >-
      always() &&
      needs.prepare_smoke_tests.outputs.has-runnable-plugins == 'true' &&
      needs.prepare_smoke_tests.outputs.skip-tests-missing-env != 'true'
    needs:
      - parse
      - prepare
      - prepare_smoke_tests
      - run_smoke_tests
    concurrency:
      group: add-smoke-test-result-comment-${{ github.ref_name }}-${{ needs.prepare.outputs.pr-number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - name: Post test result comment and status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SMOKE_TESTS_RESULT: ${{ needs.run_smoke_tests.result }}
          SUCCESS: ${{ needs.run_smoke_tests.outputs.success }}
          NATIVE_RESULT: ${{ needs.run_smoke_tests.outputs.native-result }}
          FAILED_PLUGINS: ${{ needs.run_smoke_tests.outputs.failed-plugins }}
          ERROR_LOGS: ${{ needs.run_smoke_tests.outputs.error-logs }}
          MISSING_METADATA_PLUGINS: ${{ needs.prepare_smoke_tests.outputs.missing-metadata-plugins || '' }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr-number }}
          OVERLAY_COMMIT: ${{ needs.prepare.outputs.overlay-commit }}
          OVERLAY_REPO: ${{ needs.prepare.outputs.overlay-repo }}
          OVERLAY_BRANCH: ${{ needs.prepare.outputs.overlay-branch }}
          WORKSPACE: ${{ needs.prepare.outputs.workspace }}
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const smokeTestsResult = process.env.SMOKE_TESTS_RESULT || '';
            const successOutput = process.env.SUCCESS;
            const failed = (process.env.FAILED_PLUGINS || '').trim();
            const errorLogs = (process.env.ERROR_LOGS || '').trim();
            const missingMetadataPlugins = (process.env.MISSING_METADATA_PLUGINS || '').trim();
            const pr = Number(process.env.PR_NUMBER);
            const overlayCommit = process.env.OVERLAY_COMMIT;
            const overlayRepo = process.env.OVERLAY_REPO || '';
            const overlayBranch = process.env.OVERLAY_BRANCH || '';
            const workspace = process.env.WORKSPACE || '';

            const nativeResult = process.env.NATIVE_RESULT || '';
            const success = smokeTestsResult === 'success' && successOutput === 'true';
            let failureReason = '';

            if (!success) {
              switch (smokeTestsResult) {
                case 'failure':
                  // For allowlisted workspaces both smokes run; name the divergences
                  // instead of reporting a generic failure — each direction points the
                  // triage somewhere different.
                  if (successOutput === 'true' && nativeResult === 'failure') {
                     failureReason = 'The container smoke passed but the native (in-process) smoke failed — check the native-smoke job logs and its results artifact.';
                  } else if (nativeResult === 'success') {
                     failureReason = 'The container smoke failed but the native (in-process) smoke passed — the plugin loads and boots, so look for an environment/image issue in the container job logs.';
                  } else if (nativeResult === 'failure') {
                     failureReason = 'Both the container and the native (in-process) smoke failed — the plugin itself is the likely cause. Check both jobs\' logs.';
                  } else {
                     failureReason = 'Smoke tests failed. Check the workflow logs for details.';
                  }
                  break;
                case 'cancelled':
                  failureReason = 'Smoke tests were cancelled.';
                  break;
                case 'timeout':
                  failureReason = 'Smoke tests timed out.';
                  break;
                default:
                  failureReason = `Smoke tests ended in an unexpected state: ${smokeTestsResult}. Check the workflow logs for details.`;
              }
            }

            // Write step summary (always, even if PR is unavailable)
            let summary;
            if (success) {
              summary = '### Smoke Tests Results: Passed\n\nAll plugins loaded successfully.';
            } else {
              summary = `### Smoke Tests Results: Failed\n\n${failureReason}`;
              if (failed) {
                summary += `\n\n**Failed plugins:**\n\`\`\`\n${failed}\n\`\`\``;
              }
              if (errorLogs) {
                summary += `\n\n<details><summary>Error logs from container</summary>\n\n\`\`\`\n${errorLogs}\n\`\`\`\n\n</details>`;
              }
            }
            if (missingMetadataPlugins) {
              summary += `\n\n**Published plugins skipped due to missing runnable metadata:**\n\`\`\`\n${missingMetadataPlugins}\n\`\`\``;
            }
            await core.summary.addRaw(summary).write();

            if (!pr) {
              console.log('No PR associated; skipping status and comment');
              return;
            }

            // Get current PR head SHA
            const { data: prData } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr,
            });

            // Use PR head if different from overlayCommit (/smoketest command), else use overlayCommit (immediate publish)
            const sha = prData.head.sha !== overlayCommit ? prData.head.sha : overlayCommit;
            console.log(`Status SHA: ${sha} (PR head: ${prData.head.sha}, overlay: ${overlayCommit})`);

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              description: 'Workspace Smoke Tests',
              state: success ? 'success' : 'failure',
              target_url: runUrl,
              context: 'smoketest',
            });

            let body;
            if (success) {
              body = `:white_check_mark: [Smoke tests workflow](${runUrl}) passed. All plugins loaded successfully.\n`;
              if (overlayRepo && workspace) {
                const [repoOwner, repoName] = overlayRepo.split('/');
                try {
                  await github.rest.repos.getContent({
                    owner: repoOwner,
                    repo: repoName,
                    path: `${workspace}/e2e-tests/package.json`,
                    ref: overlayBranch,
                  });
                  body += '\nRunning e2e tests\n/test e2e-ocp-helm';
                } catch {
                  body += '\nNo E2E tests available for this workspace.';
                }
              }
            } else {
              body = `:x: \n[Smoke tests workflow](${runUrl}) failed.\n\n:warning: ${failureReason}`;
              if (failed) {
                body += `\n\nThese plugins failed to load:\n${failed}`;
              }
              if (errorLogs) {
                body += `\n\n<details><summary>Error logs from container</summary>\n\n\`\`\`\n${errorLogs}\n\`\`\`\n\n</details>`;
              }
            }
            if (missingMetadataPlugins) {
              body += `\n\n:warning: Published plugins skipped due to missing runnable metadata:\n\`\`\`\n${missingMetadataPlugins}\n\`\`\``;
            }

            await github.rest.issues.createComment({
              issue_number: pr,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  add_smoke_prepare_failure_comment:
    name: Add Smoke Preparation Failure Comment
    if: always() && needs.prepare_smoke_tests.result == 'failure'
    needs:
      - prepare
      - prepare_smoke_tests
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
      statuses: write
    steps:
      - name: Report smoke test preparation failure
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          OVERLAY_COMMIT: ${{ needs.prepare.outputs.overlay-commit }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr-number }}
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const overlayCommit = process.env.OVERLAY_COMMIT;
            const pr = Number(process.env.PR_NUMBER);
            if (overlayCommit) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: overlayCommit,
                description: 'Workspace Smoke Tests - Preparation failed',
                state: 'failure',
                target_url: runUrl,
                context: 'smoketest',
              });
            }
            if (pr) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr,
                body: `:x: [Smoke tests preparation](${runUrl}) failed. Check the workflow logs for details.`
              });
            }

  add_no_workspace_comment:
    needs:
      - parse
      - prepare

    concurrency:
      group: add_no_workspace_comment-${{ github.ref_name }}-${{ needs.parse.outputs.pr-number }}
      cancel-in-progress: false

    permissions:
      statuses: write
      pull-requests: write

    if: always() && needs.prepare.outputs.overlay-branch != '' && needs.prepare.outputs.workspace == ''
    runs-on: ubuntu-latest

    steps:
      - name: Report skipped command
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUT_OVERLAY_COMMIT: ${{ needs.prepare.outputs.overlay-commit }}
          INPUT_COMMAND_NAME: ${{ needs.parse.outputs.command-name }}
          INPUT_PR_NUMBER: ${{ needs.prepare.outputs.pr-number }}

        with:
          script: |
            const prNumber = Number(core.getInput('pr_number'));
            const workflowRun = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: '${{ github.run_id }}'
            });

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: core.getInput('overlay_commit'),
              description: '${{ github.workflow }}',
              state: 'success',
              target_url: workflowRun.data.html_url,
              context: core.getInput('command_name'),
            });

            const body = `[PR action (\`/${core.getInput('command_name')}\`)](${workflowRun.data.html_url}) cancelled: PR doesn't touch only 1 workspace.`;
            await github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            })

  updatePRWithVersions:
    name: Update versions on PR from release branch
    needs:
      - parse
      - prepare

    concurrency:
      group: updatePRWithVersions-${{ github.ref_name }}-${{ needs.parse.outputs.pr-number }}
      cancel-in-progress: true

    if: needs.parse.outputs.command-name == 'update-versions'
    uses: ./.github/workflows/update-prs-with-release-branch-commits.yaml
    with:
      force: true
      pr: ${{ needs.prepare.outputs.pr-number }}
      release-branch: ${{ needs.prepare.outputs.target-branch }}
    permissions:
      actions: write
      contents: write
      pull-requests: write
      attestations: write
      packages: write
      id-token: write
      statuses: write

  updatePRWithCommit:
    name: Update commit on PR from automatic discovery
    needs:
      - parse
      - prepare

    concurrency:
      group: updatePRWithCommit-${{ github.ref_name }}-${{ needs.parse.outputs.pr-number }}
      cancel-in-progress: true

    if: needs.parse.outputs.command-name == 'update-commit'
    uses: ./.github/workflows/update-plugins-repo-refs.yaml
    with:
      single-branch: ${{ needs.prepare.outputs.target-branch }}
      allow-workspace-addition: false
      pr-to-update: ${{ needs.prepare.outputs.pr-number }}
      workspace-path: ${{ needs.prepare.outputs.workspace }}

    permissions:
      actions: write
      contents: write
      pull-requests: write
      issues: read
      attestations: write
      packages: write
      id-token: write
      statuses: write

  add_update_versions_completion_comment:
    needs:
      - parse
      - prepare
      - updatePRWithVersions

    concurrency:
      group: add_update_versions_completion_comment-${{ github.ref_name }}-${{ needs.parse.outputs.pr-number }}
      cancel-in-progress: false

    permissions:
      statuses: write
      pull-requests: write

    if: always() && needs.parse.outputs.command-name == 'update-versions' && needs.prepare.outputs.overlay-branch != '' && needs.prepare.outputs.workspace != ''
    runs-on: ubuntu-latest
    steps:
      - name: Add completion comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUT_COMMAND_NAME: ${{ needs.parse.outputs.command-name }}
          INPUT_PR_NUMBER: ${{ needs.prepare.outputs.pr-number }}
        with:
          script: |
            const prNumber = Number(core.getInput('pr_number'));
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const overlayCommit = pr.data.head.sha;
            const workflowRun = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: '${{ github.run_id }}'
            });
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: '${{ github.run_id }}',
              filter: 'latest',
            });
            const success = jobs.data.jobs
              .filter(j => j.name.startsWith('Update versions on PR'))
              .every(j => j.conclusion === 'success' || j.conclusion === 'skipped');

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: overlayCommit,
              description: '${{ github.workflow }}',
              state: success ? 'success' : 'failure',
              target_url: workflowRun.data.html_url,
              context: core.getInput('command_name'),
            });

            const body = `[Update Versions workflow](${workflowRun.data.html_url}) has completed with ${ success ? 'success' : 'failure' }.`;
            await github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            })

  add_update_commit_completion_comment:
    needs:
      - parse
      - prepare
      - updatePRWithCommit

    concurrency:
      group: add_update_commit_completion_comment-${{ github.ref_name }}-${{ needs.parse.outputs.pr-number }}
      cancel-in-progress: false

    permissions:
      statuses: write
      pull-requests: write

    if: |
      always() &&
      needs.parse.outputs.command-name == 'update-commit' &&
      needs.prepare.outputs.overlay-branch != '' &&
      needs.prepare.outputs.workspace != ''
    runs-on: ubuntu-latest
    steps:
      - name: Add completion comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUT_COMMAND_NAME: ${{ needs.parse.outputs.command-name }}
          INPUT_PR_NUMBER: ${{ needs.prepare.outputs.pr-number }}
        with:
          script: |
            const prNumber = Number(core.getInput('pr_number'));
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const overlayCommit = pr.data.head.sha;
            const workflowRun = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: '${{ github.run_id }}'
            });
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: '${{ github.run_id }}',
              filter: 'latest',
            });
            const success = jobs.data.jobs
              .filter(j => j.name.startsWith('Update commit on PR'))
              .every(j => j.conclusion === 'success' || j.conclusion === 'skipped');

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: overlayCommit,
              description: '${{ github.workflow }}',
              state: success ? 'success' : 'failure',

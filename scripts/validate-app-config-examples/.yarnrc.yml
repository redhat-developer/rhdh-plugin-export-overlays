# A real node_modules tree keeps this tool runnable as plain `node dist/validate.mjs`.
# Under PnP the bundle only resolves through `yarn node`, and the schema path
# compiles TypeScript from packages extracted to a temp dir — outside any PnP
# tree — so a conventional layout avoids resolution surprises there too.
nodeLinker: node-modules

# Lifecycle scripts are off by default (they run arbitrary code from every
# transitive dependency at install time). esbuild is opted back in explicitly
# via dependenciesMeta in package.json — it fetches its platform binary in a
# postinstall and cannot build without one.
enableScripts: false

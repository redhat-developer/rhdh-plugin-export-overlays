# A real node_modules tree keeps this tool runnable as plain `node dist/validate.mjs`.
# Under PnP the bundle only resolves through `yarn node`, and the schema path
# compiles TypeScript from packages extracted to a temp dir — outside any PnP
# tree — so a conventional layout avoids resolution surprises there too.
nodeLinker: node-modules

# Lifecycle scripts run arbitrary code from every transitive dependency at
# install time. Nothing here needs them: esbuild ships its platform binary as an
# optional dependency rather than fetching one in a postinstall, so CI installs
# with --mode=skip-build and this keeps local installs consistent with that.
enableScripts: false

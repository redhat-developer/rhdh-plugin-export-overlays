apiVersion: v1
kind: Secret
metadata:
  name: ${LOKI_SECRET_NAME}
  namespace: ${LOKI_NS}
type: Opaque
stringData:
  bucketnames: ${MINIO_BUCKET}
  endpoint: ${MINIO_ENDPOINT}
  access_key_id: ${MINIO_ACCESS_KEY}
  access_key_secret: ${MINIO_SECRET_KEY}
  region: ${MINIO_REGION}
  forcepathstyle: "true"

plugins:
  - package: "oci://registry.access.redhat.com/rhdh/backstage-community-plugin-catalog-backend-module-keycloak:{{inherit}}"
    disabled: true
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-catalog-backend-module-keycloak:bs_1.49.4__3.19.2
    disabled: false
    pluginConfig:
      catalog:
        providers:
          keycloakOrg:
            default:
              baseUrl: ${KEYCLOAK_BASE_URL}
              loginRealm: ${KEYCLOAK_LOGIN_REALM}
              realm: ${KEYCLOAK_REALM}
              clientId: ${KEYCLOAK_CLIENT_ID}
              clientSecret: ${KEYCLOAK_CLIENT_SECRET}
              schedule:
                frequency:
                  minutes: 1
                initialDelay:
                  seconds: 15
                timeout:
                  minutes: 1

  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-orchestrator:bs_1.52.0__6.0.0
    disabled: false
    pluginConfig:
      dynamicPlugins:
        frontend:
          red-hat-developer-hub.backstage-plugin-orchestrator:
            translationResources:
              - importName: orchestratorTranslations
                module: Legacy
                ref: orchestratorTranslationRef
            appIcons:
              - importName: OrchestratorIcon
                name: orchestratorIcon
                module: Legacy
            dynamicRoutes:
              - importName: OrchestratorPage
                module: Legacy
                menuItem:
                  icon: orchestratorIcon
                  text: Orchestrator
                  textKey: menuItem.orchestrator
                path: /orchestrator
            menuItems:
              orchestrator:
                parent: default.admin
                icon: orchestratorIcon
            entityTabs:
              - path: /workflows
                title: Workflows
                titleKey: catalog.entityPage.workflows.title
                mountPoint: entity.page.workflows
            mountPoints:
              - mountPoint: entity.page.workflows/cards
                importName: OrchestratorCatalogTab
                module: Legacy
                config:
                  layout:
                    gridColumn: 1 / -1
                  if:
                    anyOf:
                      - hasAnnotation: orchestrator.io/workflows

  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-orchestrator-backend:bs_1.52.0__8.12.1
    disabled: false
    pluginConfig:
      orchestrator:
        dataIndexService:
          url: ${SONATAFLOW_DATA_INDEX_URL}

  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-orchestrator-form-widgets:bs_1.52.0__2.0.0
    disabled: false
    pluginConfig:
      dynamicPlugins:
        frontend:
          red-hat-developer-hub.backstage-plugin-orchestrator-form-widgets:
            pluginModule: Legacy

  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-orchestrator-backend-module-loki:bs_1.52.0__1.4.1
    disabled: false
    pluginConfig:
      orchestrator:
        workflowLogProvider:
          loki:
            baseUrl: ${LOKI_BASE_URL}
            token: ${AUTH_TOKEN}

  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-scaffolder-backend-module-orchestrator:bs_1.52.0__1.7.2
    disabled: false
    pluginConfig:
      orchestrator:
        dataIndexService:
          url: ${SONATAFLOW_DATA_INDEX_URL}

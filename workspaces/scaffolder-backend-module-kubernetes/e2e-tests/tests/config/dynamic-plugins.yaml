# RHDH 2.0 disables the OIDC auth backend module by default; re-enable it
# so that keycloak auth works. The scaffolder Kubernetes module is also
# disabled by default and must be explicitly enabled.
plugins:
  - package: oci://quay.io/rhdh/backstage-community-plugin-auth-backend-module-keycloak-provider:{{inherit}}
    disabled: false
  - package: ./dynamic-plugins/dist/backstage-community-plugin-scaffolder-backend-module-kubernetes-dynamic
    disabled: false

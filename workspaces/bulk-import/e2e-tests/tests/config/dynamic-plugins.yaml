plugins:
  # GitHub auth provider is no longer statically included in RHDH 2.0;
  # load it as a dynamic plugin so the auth: "github" sign-in path works.
  - package: ./dynamic-plugins/dist/backstage-plugin-auth-backend-module-github-provider-dynamic
    disabled: false

  # bulk-import plugins
  - package: ./dynamic-plugins/dist/red-hat-developer-hub-backstage-plugin-bulk-import-backend-dynamic
    enabled: true
  - package: ./dynamic-plugins/dist/red-hat-developer-hub-backstage-plugin-bulk-import
    enabled: true
    pluginConfig:
      dynamicPlugins:
        frontend:
          red-hat-developer-hub.backstage-plugin-bulk-import:
            translationResources:
              - importName: bulkImportTranslations
                module: Legacy
                ref: bulkImportTranslationRef
            appIcons:
              - name: bulkImportIcon
                module: Legacy
                importName: BulkImportIcon
            dynamicRoutes:
              - path: /bulk-import
                importName: BulkImportPage
                module: Legacy
                menuItem:
                  icon: bulkImportIcon
                  text: Bulk import

  - package: ./dynamic-plugins/dist/backstage-plugin-scaffolder-backend-module-github-dynamic
    enabled: false

# Edge termination: TLS ends on the OpenShift router; backend is plain HTTP.
# Clients must use the Route hostname (north-south).
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: pq-httpd
  labels:
    app: pq-httpd
spec:
  to:
    kind: Service
    name: pq-httpd
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None

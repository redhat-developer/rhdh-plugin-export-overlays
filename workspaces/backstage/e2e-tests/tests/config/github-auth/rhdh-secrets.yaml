apiVersion: v1
kind: Secret
metadata:
  name: rhdh-secrets
type: Opaque
stringData:
  # Vault-synced (must be VAULT_* in CI / vault UI)
  AUTH_PROVIDERS_GH_ORG_NAME: $VAULT_AUTH_PROVIDERS_GH_ORG_NAME
  AUTH_PROVIDERS_GH_ORG_CLIENT_ID: $VAULT_AUTH_PROVIDERS_GH_ORG_CLIENT_ID
  AUTH_PROVIDERS_GH_ORG_CLIENT_SECRET: $VAULT_AUTH_PROVIDERS_GH_ORG_CLIENT_SECRET
  AUTH_PROVIDERS_GH_ORG_APP_ID: $VAULT_AUTH_PROVIDERS_GH_ORG_APP_ID
  AUTH_PROVIDERS_GH_ORG1_PRIVATE_KEY: $VAULT_AUTH_PROVIDERS_GH_ORG1_PRIVATE_KEY
  AUTH_PROVIDERS_GH_ORG_WEBHOOK_SECRET: $VAULT_AUTH_PROVIDERS_GH_ORG_WEBHOOK_SECRET
  RHDH_BASE_URL: $RHDH_BASE_URL

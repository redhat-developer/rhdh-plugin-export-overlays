app:
  baseUrl: ${RHDH_BASE_URL}
  title: RHDH GitHub Auth E2E

backend:
  baseUrl: ${RHDH_BASE_URL}
  cors:
    origin: ${RHDH_BASE_URL}

permission:
  enabled: false

signInPage: github

auth:
  environment: production
  providers:
    guest:
      dangerouslyAllowOutsideDevelopment: true
    github:
      production:
        clientId: ${AUTH_PROVIDERS_GH_ORG_CLIENT_ID}
        clientSecret: ${AUTH_PROVIDERS_GH_ORG_CLIENT_SECRET}
        callbackUrl: ${RHDH_BASE_URL}/api/auth/github/handler/frame
        sessionDuration: 3days
        signIn:
          resolvers:
            # Default for Backstage >= 1.10 / RHDH 1.10+
            - resolver: userIdMatchingUserEntityAnnotation

catalog:
  rules:
    - allow: [API, Component, Group, Location, Resource, System, Template, User]
  providers:
    githubOrg:
      - id: github
        githubUrl: https://github.com
        orgs:
          - ${AUTH_PROVIDERS_GH_ORG_NAME}
        schedule:
          initialDelay:
            seconds: 0
          frequency:
            minutes: 1
          timeout:
            minutes: 1

integrations:
  github:
    - host: github.com
      apps:
        - appId: ${AUTH_PROVIDERS_GH_ORG_APP_ID}
          clientId: ${AUTH_PROVIDERS_GH_ORG_CLIENT_ID}
          clientSecret: ${AUTH_PROVIDERS_GH_ORG_CLIENT_SECRET}
          privateKey: ${AUTH_PROVIDERS_GH_ORG1_PRIVATE_KEY}
          webhookSecret: ${AUTH_PROVIDERS_GH_ORG_WEBHOOK_SECRET}

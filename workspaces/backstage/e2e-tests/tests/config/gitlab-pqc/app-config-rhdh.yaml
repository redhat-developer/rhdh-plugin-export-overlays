app:
  title: RHDH GitLab PQC e2e

integrations:
  gitlab:
    - host: ${GITLAB_HOST}
      token: ${GITLAB_TOKEN}
      apiBaseUrl: https://${GITLAB_HOST}/api/v4
      baseUrl: https://${GITLAB_HOST}

catalog:
  providers:
    gitlab:
      provider:
        group: e2e-pqc-group
        host: ${GITLAB_HOST}
        schedule:
          frequency:
            minutes: 1
          initialDelay:
            seconds: 5
          timeout:
            minutes: 1

permission:
  enabled: false

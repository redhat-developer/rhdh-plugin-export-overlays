kind: ConfigMap
apiVersion: v1
metadata:
  name: openssl-pq
  labels:
    backstage.io/kubernetes-id: developer-hub
data:
  openssl-pq.cnf: |
    openssl_conf = openssl_init

    [openssl_init]
    ssl_conf = ssl_sect

    [ssl_sect]
    system_default = system_default_sect

    [system_default_sect]
    Groups = X25519MLKEM768

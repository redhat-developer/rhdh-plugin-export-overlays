app:
  title: RHDH GitLab plugin e2e

integrations:
  gitlab:
    - host: ${GITLAB_HOST}
      token: ${GITLAB_TOKEN}
      apiBaseUrl: https://${GITLAB_HOST}/api/v4

catalog:
  providers:
    gitlab:
      my-test-provider:
        group: ${GITLAB_PARENT_ORG}
        host: ${GITLAB_HOST}
        # The spec creates its project before deploy; a short frequency also
        # picks up the one a restarted worker creates after deploy.
        schedule:
          frequency:
            minutes: 1
          initialDelay:
            seconds: 5
          timeout:
            minutes: 1

permission:
  enabled: false

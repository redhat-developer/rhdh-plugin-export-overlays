app:
  title: RHDH GitHub Scaffolder Actions e2e

integrations:
  github:
    - host: github.com
      token: ${GITHUB_TOKEN}

catalog:
  import:
    entityFilename: catalog-info.yaml
  rules:
    - allow: [Template, Location]
  locations:
    - type: url
      target: https://github.com/janus-qe/overlay-scaffolder-backend-module-github-test/blob/main/github-publish.yaml
      rules:
        - allow: [Template]
    - type: url
      target: https://github.com/janus-qe/overlay-scaffolder-backend-module-github-test/blob/main/github-issues-create.yaml
      rules:
        - allow: [Template]
    - type: url
      target: https://github.com/janus-qe/overlay-scaffolder-backend-module-github-test/blob/main/github-pull-requests.yaml
      rules:
        - allow: [Template]
    - type: url
      target: https://github.com/janus-qe/overlay-scaffolder-backend-module-github-test/blob/main/github-repo-push.yaml
      rules:
        - allow: [Template]

permission:
  enabled: false

backend:
  reading:
    allow:
      - host: github.com

scaffolder:
  defaultAuthor:
    name: Scaffolder E2E
    email: scaffolder-e2e@example.com

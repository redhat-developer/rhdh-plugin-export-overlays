# Allow Red Hat PostgreSQL image under Bitnami chart image verification
# (quay.io/rhdh/chart:2.0-90-CI+). See bitnami/charts#30850 / rhdh#5490.
global:
  security:
    allowInsecureImages: true

upstream:
  # Run the hub as the namespace default SA so the in-cluster token matches RBAC
  serviceAccount:
    create: false
    name: default
  commonLabels:
    backstage.io/kubernetes-id: developer-hub

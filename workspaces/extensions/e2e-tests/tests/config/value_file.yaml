extraEnv:
  - name: NODE_ENV
    value: "development"
  - name: RHDH_EXTENSIONS_INSTALL_EXPORT_PATH
    value: /opt/app-root/src/dynamic-plugins-root/extensions-install-state.yaml

# The chart manages install-dynamic-plugins init container automatically.
# This adds only the custom init container that seeds the file the
# extensions backend expects (FileInstallationStorage requires an existing
# file with a valid `plugins` list).
extraInitContainers:
  - name: seed-extensions-installation-storage
    image: '{{ include "rhdh.image" . }}'
    command: ["/bin/sh", "-c"]
    args:
      - "test -f /dynamic-plugins-root/extensions-install-state.yaml || echo 'plugins: []' > /dynamic-plugins-root/extensions-install-state.yaml"
    securityContext:
      readOnlyRootFilesystem: false
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      runAsNonRoot: true
      seccompProfile:
        type: "RuntimeDefault"
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
    volumeMounts:
      - mountPath: /dynamic-plugins-root
        name: dynamic-plugins-root

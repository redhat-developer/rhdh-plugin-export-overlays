catalog:
  import:
    entityFilename: catalog-info.yaml
  rules:
    - allow: [API, Component, Group, Location, Resource, System, Template]
  locations:
    - type: url
      target: https://github.com/redhat-developer/rhdh/blob/main/catalog-entities/all.yaml
permission:
  enabled: true
  rbac:
    pluginsWithPermission:
      - catalog
      - permission
      - extensions
    admin:
      superUsers:
        - name: user:default/test1
extensions:
  installation:
    enabled: true
    saveToSingleFile:
      file: ${RHDH_EXTENSIONS_INSTALL_EXPORT_PATH}

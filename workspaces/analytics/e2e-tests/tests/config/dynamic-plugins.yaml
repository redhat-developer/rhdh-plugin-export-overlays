# Guest auth backend module — RHDH 2.0 no longer bundles it; must be
# loaded explicitly for auth: "guest" tests to work.
plugins:
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-plugin-auth-backend-module-guest-provider:bs_1.52.0__0.2.20
    disabled: false
  - package: ./dynamic-plugins/dist/backstage-community-plugin-analytics-provider-segment
    enabled: true
  # disable global header until https://redhat.atlassian.net/browse/RHDHBUGS-3603 is fixed
  - package: oci://quay.io/rhdh/red-hat-developer-hub-backstage-plugin-global-header:{{inherit}}
    enabled: false

apiVersion: extensions.backstage.io/v1alpha1
kind: Package
metadata:
  name: backstage-community-plugin-quay
  namespace: rhdh
  title: "Quay"
  links:
    - url: https://red.ht/rhdh
      title: Homepage
    - url: https://github.com/backstage/community-plugins/issues
      title: Bugs
    - title: Source Code
      url: https://github.com/backstage/community-plugins/tree/main/workspaces/quay
  annotations:
    backstage.io/source-location: url:https://github.com/backstage/community-plugins/tree/main/workspaces/quay
  tags: []
spec:
  packageName: "@backstage-community/plugin-quay"
  dynamicArtifact: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-quay:bs_1.54.4__1.37.2
  version: 1.37.2
  backstage:
    role: frontend-plugin
    supportedVersions: 1.54.4
  author: Red Hat
  support: community
  lifecycle: active
  partOf:
    - backstage-community-plugin-quay
  appConfigExamples:
    - title: Default configuration
      content:
        dynamicPlugins:
          frontend:
            backstage-community.plugin-quay:
              mountPoints:
                - mountPoint: entity.page.image-registry/cards
                  importName: QuayPage
                  config:
                    layout:
                      gridColumn: 1 / -1
                    if:
                      anyOf:
                        - isQuayAvailable
        # Proxy-only setup: used when the quay *backend* plugin is not installed.
        # Installing @backstage-community/plugin-quay-backend sets quay.apiUrl,
        # which takes precedence and bypasses this endpoint entirely.
        #
        # Kept equivalent to the `proxy` block in
        # e2e-tests/tests/config/app-config-rhdh.yaml — equivalent, not
        # byte-identical: that copy is written at the document root and quotes
        # differently. The two are deep-merged in PR and local-dev modes, and
        # nightly mode injects no metadata at all, so neither copy can be
        # dropped — but for this endpoint they must not disagree, or merge order
        # silently decides the target.
        #
        # Only this endpoint. An e2e config overriding metadata is normal and
        # deliberate elsewhere in the tree — analytics swaps env placeholders for
        # fixed test keys, tech-radar and orchestrator repoint URLs at
        # cluster-deployed services — so there is no repo-wide parity rule to
        # enforce this against, and a checker asserting one would be wrong five
        # workspaces out of twenty.
        proxy:
          skipInvalidProxies: true
          endpoints:
            "/quay/api":
              target: "https://quay.io/"
              headers:
                X-Requested-With: "XMLHttpRequest"
              changeOrigin: true
              secure: true
        # `quay` itself is required by the plugin's schema; every property under
        # it is optional. uiUrl is what upstream's README shows.
        quay:
          uiUrl: "https://quay.io"

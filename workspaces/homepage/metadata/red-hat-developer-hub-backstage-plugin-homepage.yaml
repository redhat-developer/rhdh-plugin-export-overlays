apiVersion: extensions.backstage.io/v1alpha1
kind: Package
metadata:
  name: red-hat-developer-hub-backstage-plugin-homepage
  namespace: rhdh
  title: Homepage
  links:
    - url: https://red.ht/rhdh
      title: Homepage
    - url: https://issues.redhat.com/browse/RHDHBUGS
      title: "Report issues here. Note: Customers of Red Hat Developer Hub should raise a Red Hat support case instead."
    - title: Source Code
      url: https://github.com/redhat-developer/rhdh-plugins/tree/main/workspaces/homepage
  annotations:
    backstage.io/source-location: url:https://github.com/redhat-developer/rhdh-plugins/tree/main/workspaces/homepage
  tags: []
spec:
  packageName: '@red-hat-developer-hub/backstage-plugin-homepage'
  dynamicArtifact: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-homepage:bs_1.54.4__1.18.0
  version: 1.18.0
  backstage:
    role: frontend-plugin
    supportedVersions: 1.54.4
  author: Red Hat
  support: generally-available
  lifecycle: active
  partOf:
    - home-page
  appConfigExamples:
    - title: Default configuration
      content:
        dynamicPlugins:
          frontend:
            red-hat-developer-hub.backstage-plugin-homepage:
              dynamicRoutes:
                - path: /
                  importName: DynamicHomePage
              mountPoints:
                - mountPoint: home.page/cards
                  importName: OnboardingSection
                  config:
                    layouts:
                      xl: { w: 12, h: 6 }
                      lg: { w: 12, h: 6 }
                      md: { w: 12, h: 7 }
                      sm: { w: 12, h: 8 }
                      xs: { w: 12, h: 9 }
                      xxs: { w: 12, h: 14 }
                - mountPoint: home.page/cards
                  importName: EntitySection
                  config:
                    layouts:
                      xl: { w: 12, h: 7 }
                      lg: { w: 12, h: 7 }
                      md: { w: 12, h: 8 }
                      sm: { w: 12, h: 9 }
                      xs: { w: 12, h: 11 }
                      xxs: { w: 12, h: 15 }
                - mountPoint: home.page/cards
                  importName: TemplateSection
                  config:
                    layouts:
                      xl: { w: 12, h: 5 }
                      lg: { w: 12, h: 5 }
                      md: { w: 12, h: 5 }
                      sm: { w: 12, h: 5 }
                      xs: { w: 12, h: 7.5 }
                      xxs: { w: 12, h: 13.5 }
                - mountPoint: home.page/widgets
                  importName: RecentlyVisitedCard
                  config:
                    title: 'Recently Visited'
                    description: 'Quick access to recently viewed entities and pages'
                    priority: 2
                    layouts:
                      xl: { w: 4, h: 3 }
                      lg: { w: 4, h: 3 }
                      md: { w: 6, h: 3 }
                      sm: { w: 12, h: 3 }
                      xs: { w: 12, h: 3 }
                      xxs: { w: 12, h: 3 }
                - mountPoint: home.page/widgets
                  importName: TopVisitedCard
                  config:
                    title: 'Most Visited'
                    description: 'Your most frequently accessed entities and services'
                    priority: 1
                    layouts:
                      xl: { w: 4, h: 3 }
                      lg: { w: 4, h: 3 }
                      md: { w: 6, h: 3 }
                      sm: { w: 12, h: 3 }
                      xs: { w: 12, h: 3 }
                      xxs: { w: 12, h: 3 }
    - title: New frontend system (app-next / NFS)
      content:
        app:
          extensions:
            - page:home:
                config:
                  path: /
            - api:home/visits: true
            - app-root-element:home/visit-listener: true
            - home-page-layout:home/dynamic-homepage-layout:
                config:
                  customizable: true
                  widgetLayout:
                    RhdhTemplateSection:
                      priority: 300
                      breakpoints:
                        xl: { w: 12, h: 5 }
                        lg: { w: 12, h: 5 }
                    RhdhEntitySection:
                      priority: 200
                      breakpoints:
                        xl: { w: 12, h: 7 }
                        lg: { w: 12, h: 7 }
                    RhdhOnboardingSection:
                      priority: 100
                      breakpoints:
                        xl: { w: 12, h: 6 }
                        lg: { w: 12, h: 6 }
        # homepage.defaultWidgets is not supported on NFS yet — uncomment when it is:
        # homepage:
        #   defaultWidgets:
        #     - id: onboarding
        #       ref: rhdh-onboarding-section
        #     - id: entity-list
        #       ref: rhdh-entity-section
        #     - id: template-list
        #       ref: rhdh-template-section


# NFS: use RH page:homepage as the sole Home. Keep community home package for
# visits APIs (see dynamic-plugins.yaml), but disable page:home so the sidebar
# does not show two Home items.
app:
  extensions:
    - page:home: false
    - page:homepage:
        config:
          path: /
          title: Home
    - api:home/visits: true
    - app-root-element:home/visit-listener: true
    - home-page-layout:homepage/dynamic-homepage-layout:
        config:
          customizable: true

permission:
  enabled: true
  rbac:
    policies-csv-file: "./rbac/rbac-policy.csv"
    pluginsWithPermission:
      - catalog
      - permission
      - homepage
    admin:
      users:
        - name: user:default/homepage-admin

# Shared by legacy and app-next projects.
# NFS (app-next) requires app.extensions so Home is registered, plus the upstream
# backstage-plugin-home OCI (see dynamic-plugins-app-next.yaml). Legacy ignores these.
app:
  extensions:
    - page:home:
        config:
          path: /
    - api:home/visits: true
    - app-root-element:home/visit-listener: true
    - home-page-layout:home/dynamic-homepage-layout:
        config:
          customizable: true

permission:
  enabled: true
  rbac:
    policies-csv-file: "./rbac/rbac-policy.csv"
    pluginsWithPermission:
      - catalog
      - permission
      - homepage
    admin:
      users:
        - name: user:default/homepage-admin

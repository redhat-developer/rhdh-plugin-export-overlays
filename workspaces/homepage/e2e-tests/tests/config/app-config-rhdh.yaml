# Shared by legacy and app-next projects.
# NFS (app-next) requires app.extensions to enable/configure page:home (from homepage
# alpha homePagePlugin). Legacy ignores these.
app:
  extensions:
    - page:home:
        config:
          path: /
    - api:home/visits: true
    - app-root-element:home/visit-listener: true
    - home-page-layout:home/dynamic-homepage-layout:
        config:
          customizable: true
          # widgetLayout:
          #   RhdhTemplateSection:
          #     priority: 300
          #     breakpoints:
          #       xl: { w: 12, h: 5 }
          #       lg: { w: 12, h: 5 }
          #       md: { w: 12, h: 5 }
          #       sm: { w: 12, h: 5 }
          #       xs: { w: 12, h: 7.5 }
          #       xxs: { w: 12, h: 13.5 }
          #   RhdhEntitySection:
          #     priority: 200
          #     breakpoints:
          #       xl: { w: 12, h: 7 }
          #       lg: { w: 12, h: 7 }
          #       md: { w: 12, h: 8 }
          #       sm: { w: 12, h: 9 }
          #       xs: { w: 12, h: 11 }
          #       xxs: { w: 12, h: 15 }
          #   RhdhOnboardingSection:
          #     priority: 100
          #     breakpoints:
          #       xl: { w: 12, h: 6 }
          #       lg: { w: 12, h: 6 }
          #       md: { w: 12, h: 7 }
          #       sm: { w: 12, h: 8 }
          #       xs: { w: 12, h: 9 }
          #       xxs: { w: 12, h: 14 }

permission:
  enabled: true
  rbac:
    policies-csv-file: "./rbac/rbac-policy.csv"
    pluginsWithPermission:
      - catalog
      - permission
      - homepage
    admin:
      users:
        - name: user:default/homepage-admin

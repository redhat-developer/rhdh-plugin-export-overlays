# the RHDH homepage alpha module extends pluginId "home" and requires this OCI.
#
# homepage.defaultWidgets (homepage-backend) is not supported on NFS yet — keep the
# commented block below and enable it when support lands. NFS tests seed widgets via
# the UI until then.
plugins:

# NFS (app-next) dynamic plugins for homepage e2e.
# Upstream @backstage/plugin-home provides page:home / visits / layout blueprints;
# the RHDH homepage alpha module extends pluginId "home" and requires this OCI.
#
# homepage.defaultWidgets (homepage-backend) is not supported on NFS yet — keep the
# commented block below and enable it when support lands. NFS tests seed widgets via
# the UI until then.
plugins:
  # Auth layer adds this with {{inherit}}; hub image has no base version, so install
  # fails. Merge is by exact package string (no normalizeKey), so disable it explicitly
  # and enable a pinned GHCR artifact below (workspaces/keycloak metadata).
  - package: oci://registry.access.redhat.com/rhdh/backstage-community-plugin-catalog-backend-module-keycloak:{{inherit}}
    disabled: true
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-catalog-backend-module-keycloak:bs_1.49.4__3.19.2
    disabled: false
    pluginConfig:
      catalog:
        providers:
          keycloakOrg:
            default:
              baseUrl: ${KEYCLOAK_BASE_URL}
              loginRealm: ${KEYCLOAK_LOGIN_REALM}
              realm: ${KEYCLOAK_REALM}
              clientId: ${KEYCLOAK_CLIENT_ID}
              clientSecret: ${KEYCLOAK_CLIENT_SECRET}
              schedule:
                frequency:
                  minutes: 1
                initialDelay:
                  seconds: 15
                timeout:
                  minutes: 1
  # e2e-test-utils NFS layer pins app-auth / app-integrations at bs_1.49.4.
  # dynamic-plugins.default.yaml (catalog index includes) already ships bs_1.52.0 —
  # do not add those OCIs here or InstallException reports duplicates.
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-app-auth:bs_1.49.4__0.0.1
    disabled: true
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-app-integrations:bs_1.49.4__0.0.1
    disabled: true
  # Catalog / DPDY enables app-defaults from quay midstream 2.0.0--0.0.2, which lacks
  # the io.backstage.dynamic-packages annotation (InstallException). Disable it and use
  # the community GHCR artifact from workspaces/app-defaults metadata instead.
  - package: oci://quay.io/rhdh/red-hat-developer-hub-backstage-plugin-app-defaults:2.0.0--0.0.2
    disabled: true
  # Version from workspaces/app-defaults/metadata/red-hat-developer-hub-backstage-plugin-app-defaults.yaml
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-app-defaults:bs_1.52.0__0.0.3
    disabled: false
  # Version from workspaces/backstage export: backstage-plugin-home
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-plugin-home:bs_1.52.0__0.9.7
    disabled: false
  # Version from workspaces/homepage/metadata/red-hat-developer-hub-backstage-plugin-homepage.yaml
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-homepage:bs_1.52.0__1.17.1
    disabled: false
  # Version from workspaces/homepage/metadata/red-hat-developer-hub-backstage-plugin-homepage-backend.yaml
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-homepage-backend:bs_1.52.0__0.4.0
    disabled: false

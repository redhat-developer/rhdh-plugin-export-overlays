# Chart 2.y auto-manages system volumes (dynamic-plugins-root, extensions-catalog,
# temp, etc.) — only user volumes need to be listed here.
extraVolumeMounts:
  - name: rbac-policy
    mountPath: /opt/app-root/src/rbac
extraVolumes:
  - name: rbac-policy
    configMap:
      defaultMode: 420
      name: rbac-policy

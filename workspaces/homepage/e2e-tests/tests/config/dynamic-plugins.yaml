plugins:
  # Auth layer adds this with {{inherit}}; hub image has no base version, so install
  # fails. Merge is by exact package string (no normalizeKey), so disable it explicitly
  # and enable a pinned GHCR artifact below (workspaces/keycloak metadata).
  - package: oci://registry.access.redhat.com/rhdh/backstage-community-plugin-catalog-backend-module-keycloak:{{inherit}}
    disabled: true
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-catalog-backend-module-keycloak:bs_1.49.4__3.19.2
    disabled: false
    pluginConfig:
      catalog:
        providers:
          keycloakOrg:
            default:
              baseUrl: ${KEYCLOAK_BASE_URL}
              loginRealm: ${KEYCLOAK_LOGIN_REALM}
              realm: ${KEYCLOAK_REALM}
              clientId: ${KEYCLOAK_CLIENT_ID}
              clientSecret: ${KEYCLOAK_CLIENT_SECRET}
              schedule:
                frequency:
                  minutes: 1
                initialDelay:
                  seconds: 15
                timeout:
                  minutes: 1
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-homepage:bs_1.52.0__1.17.1
    enabled: true
    pluginConfig:
      dynamicPlugins:
        frontend:
          red-hat-developer-hub.backstage-plugin-homepage:
            dynamicRoutes:
              - path: /
                importName: DynamicCustomizableHomePage
            mountPoints:
              - mountPoint: home.page/cards
                importName: OnboardingSection
                config:
                  id: onboarding-section
                  title: Onboarding section
              - mountPoint: home.page/cards
                importName: EntitySection
                config:
                  id: entity-section
                  title: Entity section
              - mountPoint: home.page/cards
                importName: TemplateSection
                config:
                  id: template-section
                  title: Template section
              - mountPoint: home.page/cards
                importName: QuickAccessCard
                config:
                  id: quickaccess-card
                  title: Quick Access
              - mountPoint: home.page/cards
                importName: RecentlyVisitedCard
                config:
                  id: recently-visited-card
                  title: Recently Visited
              - mountPoint: home.page/cards
                importName: TopVisitedCard
                config:
                  id: top-visited-card
                  title: Top Visited
            translationResources:
              - importName: homepageTranslations
                ref: homepageTranslationRef
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-homepage-backend:bs_1.52.0__0.4.0
    enabled: true
    pluginConfig:
      homepage:
        defaultWidgets:
          - id: onboarding-section
            ref: onboarding-section
            props:
              title: Onboarding section
          - id: entity-section
            ref: entity-section
            props:
              title: Entity section
          - if:
              groups: [group:default/admins]
            children:
              - id: template-section
                ref: template-section
                props:
                  title: Template section
              - id: quickaccess-card
                ref: quickaccess-card
                props:
                  title: Quick Access
          - if:
              groups: [group:default/developers]
            children:
              - id: recently-visited-card
                ref: recently-visited-card
                props:
                  title: Recently Visited
              - id: top-visited-card
                ref: top-visited-card
                props:
                  title: Top Visited

plugins:
  - package: oci://quay.io/rhdh/backstage-plugin-kubernetes-backend:{{inherit}}
    enabled: true
  - package: oci://quay.io/rhdh/backstage-plugin-kubernetes:{{inherit}}
    enabled: true
  - package: ./dynamic-plugins/dist/backstage-community-plugin-topology
    enabled: true
    pluginConfig:
      dynamicPlugins:
        frontend:
          backstage-community.plugin-topology:
            mountPoints:
              - mountPoint: entity.page.topology/cards
                importName: TopologyPage
                config:
                  layout:
                    gridColumn: 1 / -1
                    height: 75vh
                  if:
                    anyOf:
                      - hasAnnotation: backstage.io/kubernetes-id
                      - hasAnnotation: backstage.io/kubernetes-namespace
  # disable global header until https://redhat.atlassian.net/browse/RHDHBUGS-3603 is fixed
  - package: oci://quay.io/rhdh/red-hat-developer-hub-backstage-plugin-global-header:{{inherit}}
    enabled: false

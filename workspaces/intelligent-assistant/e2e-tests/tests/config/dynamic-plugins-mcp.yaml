# Default dynamic-plugins overlay for IA E2E (selected by test-helper.ts).
# IA + MCP actions/extras. Nightly without MCP uses dynamic-plugins-nightly.yaml
# when DISABLE_MCP_NIGHTLY is set.
#
# RHDH 1.11-CI catalog index is on quay.io; e2e-test-utils 2.1.8 still emits
# registry.access.redhat.com {{inherit}} for keycloak. inherit only matches
# the same image registry/repo, so remap keycloak to quay and disable the
# RHEC inherit. Homepage 1.11.0--1.17.0 is not on Quay (manifest unknown).
#
# app-defaults provides the host drawer used by the Intelligent Assistant FAB.
# Keycloak OIDC auth plugins come from e2e-test-utils (2.1.10+).
# intelligentAssistant.plugins: [] in value_file.yaml so the chart does not inject
# intelligent-assistant:{{inherit}}.
plugins:
  - package: ./dynamic-plugins/dist/backstage-community-plugin-analytics-provider-segment
    enabled: false
  - package: oci://registry.access.redhat.com/rhdh/backstage-community-plugin-analytics-provider-segment:{{inherit}}
    enabled: false
  - package: oci://quay.io/rhdh/backstage-community-plugin-analytics-provider-segment:{{inherit}}
    enabled: false
  - package: oci://quay.io/rhdh/red-hat-developer-hub-backstage-plugin-homepage:1.11.0--1.17.0
    enabled: false
  - package: oci://quay.io/rhdh/red-hat-developer-hub-backstage-plugin-quickstart:{{inherit}}
    enabled: false
  - package: oci://registry.access.redhat.com/rhdh/backstage-community-plugin-catalog-backend-module-keycloak:{{inherit}}
    enabled: false
  - package: oci://quay.io/rhdh/backstage-community-plugin-catalog-backend-module-keycloak:{{inherit}}
    enabled: true
    pluginConfig:
      catalog:
        providers:
          keycloakOrg:
            default:
              baseUrl: ${KEYCLOAK_BASE_URL}
              loginRealm: ${KEYCLOAK_LOGIN_REALM}
              realm: ${KEYCLOAK_REALM}
              clientId: ${KEYCLOAK_CLIENT_ID}
              clientSecret: ${KEYCLOAK_CLIENT_SECRET}
              schedule:
                frequency:
                  minutes: 1
                initialDelay:
                  seconds: 15
                timeout:
                  minutes: 1
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-intelligent-assistant:bs_1.54.6__5.1.0!red-hat-developer-hub-backstage-plugin-intelligent-assistant
    enabled: true
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-intelligent-assistant-backend:bs_1.54.6__5.1.0!red-hat-developer-hub-backstage-plugin-intelligent-assistant-backend
    enabled: true
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-app-defaults:bs_1.52.0__0.0.3
    enabled: true
  # MCP server backend plugin.
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-plugin-mcp-actions-backend:bs_1.54.6__0.2.1!backstage-plugin-mcp-actions-backend
    enabled: true
  # MCP extras that expose catalog, docs, and scaffolder tools.
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-software-catalog-mcp-extras:bs_1.54.6__0.2.5!red-hat-developer-hub-backstage-plugin-software-catalog-mcp-extras
    enabled: true
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-techdocs-mcp-extras:bs_1.54.6__0.2.6!red-hat-developer-hub-backstage-plugin-techdocs-mcp-extras
    enabled: true
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-scaffolder-mcp-extras:bs_1.54.6__0.4.4!red-hat-developer-hub-backstage-plugin-scaffolder-mcp-extras
    enabled: true

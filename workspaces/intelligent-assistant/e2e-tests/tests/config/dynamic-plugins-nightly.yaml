# Intelligent Assistant is disabled by default in the catalog index — enable
# it explicitly so nightly tests can load the plugin.
# Pin app-defaults so the host drawer is present when inherit is unavailable
# (RHIDP-15482). Keycloak OIDC auth plugins come from e2e-test-utils (2.1.10+).
plugins:
  - package: ref://red-hat-developer-hub-backstage-plugin-intelligent-assistant
    disabled: false
  - package: ref://red-hat-developer-hub-backstage-plugin-intelligent-assistant-backend
    disabled: false
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-app-defaults:bs_1.52.0__0.0.3
    enabled: true

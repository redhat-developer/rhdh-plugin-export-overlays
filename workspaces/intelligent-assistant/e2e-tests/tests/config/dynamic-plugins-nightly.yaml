# Intelligent-assistant is already in dynamic-plugins.default.yaml from the catalog index.
# Do not add workspace metadata plugins here — nightly would duplicate OCI entries.
#
# OIDC is image-baked and is not in the catalog-index DPDY, so it must be
# enabled here or Keycloak sign-in 404s with "Unknown auth provider 'oidc'".
plugins:
  - package: ./dynamic-plugins/dist/backstage-plugin-auth-backend-module-oidc-provider-dynamic
    disabled: false

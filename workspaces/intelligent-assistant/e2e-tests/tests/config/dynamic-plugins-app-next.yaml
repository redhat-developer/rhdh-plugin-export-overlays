# NFS lane only (see test-helper). Lists workspace plugins so metadata
# appConfigExamples still inject, plus app-defaults for app-root-wrapper:app/drawer.
plugins:
  # RHDH 1.11 dropped the local dist copy; catalog-index DPDY does not list it.
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-plugin-auth-backend-module-oidc-provider:bs_1.52.0__0.4.17
    disabled: false
  - package: ./dynamic-plugins/dist/red-hat-developer-hub-backstage-plugin-intelligent-assistant
    enabled: true
  - package: ./dynamic-plugins/dist/red-hat-developer-hub-backstage-plugin-intelligent-assistant-backend-dynamic
    enabled: true
  # Host drawer used by the Intelligent Assistant FAB. Cross-workspace OCI; not rewritten.
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-app-defaults:bs_1.52.0__0.0.3
    enabled: true

app:
  title: RHDH Keycloak Auth E2E
  baseUrl: ${RHDH_BASE_URL}

backend:
  baseUrl: ${RHDH_BASE_URL}
  cors:
    origin: ${RHDH_BASE_URL}

permission:
  enabled: false

auth:
  environment: production
  providers:
    keycloak:
      production:
        clientId: ${AUTH_KEYCLOAK_CLIENT_ID}
        clientSecret: ${AUTH_KEYCLOAK_CLIENT_SECRET}
        baseUrl: ${AUTH_KEYCLOAK_BASE_URL}
        realm: ${AUTH_KEYCLOAK_REALM}
        prompt: auto
        signIn:
          resolvers:
            - resolver: preferredUsernameMatchingUserEntityName
    github:
      production:
        clientId: ${AUTH_PROVIDERS_GH_ORG_CLIENT_ID}
        clientSecret: ${AUTH_PROVIDERS_GH_ORG_CLIENT_SECRET}
        callbackUrl: ${RHDH_BASE_URL}/api/auth/github/handler/frame

catalog:
  rules:
    - allow: [User, Group]
  providers:
    keycloakOrg:
      default:
        baseUrl: ${KEYCLOAK_BASE_URL}
        loginRealm: ${KEYCLOAK_LOGIN_REALM}
        realm: ${KEYCLOAK_REALM}
        clientId: ${KEYCLOAK_CLIENT_ID}
        clientSecret: ${KEYCLOAK_CLIENT_SECRET}
        schedule:
          frequency:
            minutes: 1
          initialDelay:
            seconds: 15
          timeout:
            minutes: 1

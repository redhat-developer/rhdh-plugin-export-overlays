# Chart 2.y / current installer honors `enabled` (not legacy `disabled: false`).
# Use local dist path so PR mode rewrites to pr_* OCI tags.
plugins:
  - package: ./dynamic-plugins/dist/backstage-community-plugin-acr
    enabled: true
    pluginConfig:
      dynamicPlugins:
        frontend:
          backstage-community.plugin-acr:
            mountPoints:
              - mountPoint: entity.page.image-registry/cards
                importName: AcrImagesEntityContent
                config:
                  layout:
                    gridColumn: 1 / -1
                  if:
                    anyOf:
                      - isAcrAvailable
  # disable global header until https://redhat.atlassian.net/browse/RHDHBUGS-3603 is fixed
  - package: oci://quay.io/rhdh/red-hat-developer-hub-backstage-plugin-global-header:{{inherit}}
    enabled: false

apiVersion: extensions.backstage.io/v1alpha1
kind: Package
metadata:
  name: dynatrace-backstage-plugin-dql-backend
  namespace: dynatrace
  title: "DQL Backend"
  links:
    - url: https://www.dynatrace.com/
      title: Homepage
    - url: https://github.com/Dynatrace/backstage-plugin/issues
      title: Issues
    - title: Source Code
      url: https://github.com/Dynatrace/backstage-plugin
  annotations:
    backstage.io/source-location: url:https://github.com/Dynatrace/backstage-plugin
  tags: []
spec:
  packageName: "@dynatrace/backstage-plugin-dql-backend"
  dynamicArtifact: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/dynatrace-backstage-plugin-dql-backend:bs_1.49.4__2.7.0
  version: 2.7.0
  backstage:
    role: backend-plugin
    supportedVersions: 1.49.4
  author: Dynatrace
  support: generally-available
  lifecycle: active
  partOf:
    - dynatrace-commercial
  appConfigExamples:
    - title: Default configuration
      content:
        dynatrace:
          # Platform token rather than an OAuth client: the plugin's published
          # config.d.ts types environments as `Oauth | PlatformToken[]` instead
          # of `(Oauth | PlatformToken)[]`, so an array of OAuth environments
          # fails Backstage's config validation at startup.
          # See Dynatrace/backstage-plugin#331.
          environments:
            - name: ${DYNATRACE_NAME}
              url: ${DYNATRACE_URL}
              platformToken: ${DYNATRACE_PLATFORM_TOKEN}

# Scorecard filecheck e2e tests — only the plugins required for filecheck metric tests.
# Includes: scorecard frontend/backend, filecheck backend module, and dynamic home page.
# GitHub, Jira, Dependabot, and OpenSSF backend modules are intentionally excluded.
plugins:
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-scorecard:bs_1.52.0__4.1.0
    disabled: false
    pluginConfig:
      dynamicPlugins:
        frontend:
          red-hat-developer-hub.backstage-plugin-scorecard:
            # Legacy exports require `module: Legacy` — they are not available on the default module.
            translationResources:
              - importName: scorecardTranslations
                module: Legacy
                ref: scorecardTranslationRef
            entityTabs:
              - path: "/scorecard"
                title: Scorecard
                mountPoint: entity.page.scorecard
            dynamicRoutes:
              - path: /scorecard/aggregations/:aggregationId/metrics/:metricId
                importName: ScorecardPage
                module: Legacy
            mountPoints:
              - mountPoint: entity.page.scorecard/cards
                importName: EntityScorecardContent
                module: Legacy
                config:
                  layout:
                    gridColumn: 1 / -1
              - mountPoint: home.page/cards
                importName: ScorecardHomepageCard
                module: Legacy
                config:
                  id: "scorecard-filecheck.readme"
                  title: "README file exists"
                  description: "Checks if the README file exists in the repository"
                  props:
                    aggregationId: "filecheck.readme"
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-scorecard-backend:bs_1.52.0__4.1.0
    disabled: false
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-scorecard-backend-module-filecheck:bs_1.52.0__1.0.1
    disabled: false
    pluginConfig:
      scorecard:
        metricProviders:
          filecheck:
            fileExistence:
              options:
                files:
                  readme: "README.md"
              schedule:
                frequency:
                  minutes: 10
                timeout:
                  minutes: 10
                initialDelay:
                  seconds: 120
  - package: oci://quay.io/rhdh/red-hat-developer-hub-backstage-plugin-homepage:{{inherit}}
    enabled: true
    pluginConfig:
      dynamicPlugins:
        frontend:
          red-hat-developer-hub.backstage-plugin-homepage:
            dynamicRoutes:
              - path: /
                importName: DynamicCustomizableHomePage
            mountPoints:
              - mountPoint: home.page/cards
                importName: EntitySection
                config:
                  id: "entity-section"
                  title: "Entity section"

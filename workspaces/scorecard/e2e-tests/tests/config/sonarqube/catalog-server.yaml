# Serves catalog entities to RHDH inside the test namespace.
# sonarqube-deploy.ts substitutes PYTHON_IMAGE with an openshift/python imagestream.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarqube-catalog
  labels:
    app: sonarqube-catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sonarqube-catalog
  template:
    metadata:
      labels:
        app: sonarqube-catalog
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: catalog
          image: ${PYTHON_IMAGE}
          imagePullPolicy: IfNotPresent
          command: ["python3"]
          args:
            - -m
            - http.server
            - "8080"
            - --bind
            - 0.0.0.0
            - --directory
            - /srv
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: entities
              mountPath: /srv
              readOnly: true
          readinessProbe:
            httpGet:
              path: /entities.yaml
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 200m
      volumes:
        - name: entities
          configMap:
            name: sonarqube-catalog-entities
---
apiVersion: v1
kind: Service
metadata:
  name: sonarqube-catalog
  labels:
    app: sonarqube-catalog
spec:
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    app: sonarqube-catalog

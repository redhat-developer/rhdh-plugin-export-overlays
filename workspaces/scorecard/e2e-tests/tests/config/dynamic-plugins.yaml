# Enable Scorecard plugin for e2e tests (main scorecard project).
# Filecheck backend module is intentionally excluded — it lives in filecheck/dynamic-plugins.yaml.
plugins:
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-scorecard:bs_1.52.0__4.1.0
    enabled: true
    pluginConfig:
      dynamicPlugins:
        frontend:
          red-hat-developer-hub.backstage-plugin-scorecard:
            # Legacy exports require `module: Legacy` — they are not available on the default module.
            translationResources:
              - importName: scorecardTranslations
                module: Legacy
                ref: scorecardTranslationRef
            entityTabs:
              - path: "/scorecard"
                title: Scorecard
                mountPoint: entity.page.scorecard
            dynamicRoutes:
              - path: /scorecard/aggregations/:aggregationId/metrics/:metricId
                importName: ScorecardPage
                module: Legacy
            mountPoints:
              - mountPoint: entity.page.scorecard/cards
                importName: EntityScorecardContent
                module: Legacy
                config:
                  layout:
                    gridColumn: 1 / -1
              - mountPoint: home.page/cards
                importName: ScorecardHomepageCard
                module: Legacy
                config:
                  id: "scorecard-jira.openIssues"
                  title: "Jira open blocking tickets"
                  props:
                    aggregationId: "jira.openIssues"
              - mountPoint: home.page/cards
                importName: ScorecardHomepageCard
                module: Legacy
                config:
                  id: "scorecard-github.openPRs"
                  title: "GitHub open PRs"
                  props:
                    aggregationId: "github.openPRs"
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-scorecard-backend:bs_1.52.0__4.1.0
    enabled: true
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-scorecard-backend-module-github:bs_1.52.0__4.1.0
    enabled: true
    pluginConfig:
      scorecard:
        metricProviders:
          github:
            openPRs:
              schedule:
                frequency:
                  hours: 0
                  minutes: 5
                timeout:
                  minutes: 15
                initialDelay:
                  seconds: 10
              thresholds:
                rules:
                  - key: ideal
                    expression: "<30"
                    icon: star
                    color: "rgb(180, 211, 178)"
                  - key: warning
                    expression: 30-70
                    icon: scorecardWarningStatusIcon
                    color: "#FAD5A5"
                  - key: critical
                    expression: ">70"
                    icon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" style="color:#FAA0A0"><rect x="4" y="4" width="16" height="16" rx="2" stroke="#FAA0A0" stroke-width="2"/><path d="M9 9l6 6M15 9l-6 6" stroke="#FAA0A0" stroke-width="2" stroke-linecap="round"/></svg>
                    color: "#faa0a0"
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-scorecard-backend-module-jira:bs_1.52.0__4.1.0
    enabled: true
    pluginConfig:
      jira:
        baseUrl: ${JIRA_URL}
        token: ${JIRA_TOKEN}
        product: cloud
      scorecard:
        metricProviders:
          jira:
            openIssues:
              schedule:
                frequency:
                  minutes: 5
                timeout:
                  minutes: 5
                initialDelay:
                  seconds: 15
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-scorecard-backend-module-dependabot:bs_1.52.0__1.0.1

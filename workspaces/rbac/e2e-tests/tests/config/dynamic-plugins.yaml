plugins:
  # RHDH 2.0 disables this module by default; re-enable for OIDC auth to work.
  - package: oci://quay.io/rhdh/backstage-community-plugin-auth-backend-module-keycloak-provider:{{inherit}}
    disabled: false
  - package: ./dynamic-plugins/dist/backstage-community-plugin-rbac
    enabled: true
    pluginConfig:
      dynamicPlugins:
        frontend:
          backstage-community.plugin-rbac:
            translationResources:
              - importName: rbacTranslations
                ref: rbacTranslationRef
            appIcons:
              - name: rbacIcon
                importName: RbacIcon
                module: Legacy
            dynamicRoutes:
              - path: /rbac
                importName: RbacPage
                module: Legacy
                menuItem:
                  icon: rbacIcon
                  text: RBAC
                  textKey: menuItem.rbac
            menuItems:
              rbac:
                parent: default.admin
                icon: rbacIcon

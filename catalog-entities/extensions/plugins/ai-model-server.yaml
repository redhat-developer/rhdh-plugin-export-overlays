  description: |
    # AI Model Server Catalog Module

    This backend module teaches the Backstage Software Catalog to accept
    and validate entities of `kind: AiModelServerAPI` with
    `spec.type: ai-model-server`.

    ### Catalog Model Layer design

    The module registers an `AiModelServerApiProcessor` that validates
    incoming entities against a dedicated schema. This uses the Backstage
    Catalog Model Layer pattern — a `CatalogProcessor` that implements
    `validateEntityKind` to enforce the `AiModelServerAPI` kind and its
    required fields.

    ### Relationship to upstream proposal

    The `AiModelServerAPI` kind intentionally mirrors the schema proposed
    in [backstage/backstage#34476](https://github.com/backstage/backstage/pull/34476)
    for an upstream `API` entity with type `ai-model-server`. Using a
    distinct kind avoids a registration collision with the existing `API`
    kind and provides a straightforward migration path if the upstream
    proposal is accepted.

    ### Entity schema

    Required fields:

    - `spec.type` — must be `ai-model-server`
    - `spec.lifecycle` — entity lifecycle stage (e.g. `production`,
      `experimental`)
    - `spec.owner` — owning team or user entity reference
    - `spec.serverType` — the model serving protocol or platform type
      (e.g. `openai-v1`, `grpc`)
    - `spec.serverUrl` — URL of the model server endpoint

    Optional fields:

    - `spec.system` — link to a parent Backstage System entity
    - `spec.requiresApiKey` — whether the server requires an API key
    - `spec.apiEntityRef` — reference to a related API entity
    - `spec.models` — list of models available on the server

    ### Companion plugins

    This module only registers the entity kind. To discover and populate
    `AiModelServerAPI` entities automatically, install the KServe/Kubeflow
    Connector and AI Model Catalog plugins alongside this module.

    ## Support

    - **Validation Source code**: [catalog-backend-module-ai-model-server](https://github.com/redhat-developer/rhdh-plugins/tree/main/workspaces/ai-integrations/plugins/catalog-backend-module-ai-model-server)
    - **Schema Source code**: [catalog-backend-module-ai-model-server](https://github.com/redhat-developer/rhdh-plugins/tree/main/workspaces/ai-integrations/plugins/catalog-model-ai-model-server)
    - **Issues**: [Jira Issues](https://issues.redhat.com/browse/RHDHBUGS)

  packages:

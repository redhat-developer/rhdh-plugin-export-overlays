  installation: |
    ## Installation

    ### Dynamic Plugin Installation for Red Hat Developer Hub

    Add the following to your dynamic plugin configuration:

    ```yaml
    includes:
      - dynamic-plugins.default.yaml
    plugins:
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-catalog-backend-module-ai-model-server:bs_1.54.4__0.3.1
        enabled: true
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-catalog-model-ai-model-server:bs_1.54.4__0.2.1
        enabled: true
    ```

    ## RHDH Configuration

    No plugin-specific app-config is required beyond allowing the
    `AiModelServerAPI` kind in the catalog rules:

    ```yaml
    catalog:
      rules:
        - allow:
            [
              Component,
              System,
              API,
              AiModelServerAPI,
              Resource,
              Location,
              User,
              Group,
            ]
    ```

  installation: |
    ## Installation

    ### Dynamic Plugin Installation for Red Hat Developer Hub

    Add the following to your dynamic plugin configuration. Both the
    KServe/Kubeflow Connector and the AI Model Server catalog module
    must also be installed (see their respective plugin entries).

    ```yaml
    includes:
      - dynamic-plugins.default.yaml
    plugins:
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-catalog-backend-module-model-catalog:bs_1.54.4__1.0.2
        enabled: true
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-catalog-techdoc-url-reader-backend:bs_1.54.4__0.6.2
        enabled: true
    ```

    ## RHDH Configuration

    The model-catalog entity provider discovers the connector endpoint
    automatically through Backstage service discovery. Configure the
    provider schedule and defaults under `catalog.providers.modelCatalog`.
    Cluster connection is configured on the connector plugin — see the
    KServe/Kubeflow Connector plugin entry for details.

    Example provider configuration:

    ```yaml
    catalog:
      rules:
        - allow:
            [
              Component,
              System,
              API,
              AiModelServerAPI,
              Resource,
              Location,
              User,
              Group,
              AiResource,
            ]
      providers:
        modelCatalog:
          kserve-kubeflow-connector:
            my-cluster:
              name: my-k8s-cluster
              kubernetesPluginRef: my-k8s-cluster
              default-owner: my-team
              default-lifecycle: production
    ```

  installation: |
      ## Installation

      ### Dynamic Plugin Installation for Red Hat Developer Hub

      Add the following configuration to your dynamic plugin yaml:

      ```yaml
      includes:
        - dynamic-plugins.default.yaml
      plugins:
        # Frontend plugin
        - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-intelligent-assistant:bs_1.54.9__5.3.10!red-hat-developer-hub-backstage-plugin-intelligent-assistant
          enabled: true
          pluginConfig:
            intelligent-assistant:
              # OPTIONAL: Custom users prompts displayed to users
              # If not provided, the plugin uses built-in default prompts
              prompts:
                - title: 'Getting Started with Red Hat Developer Hub'
                  message: Can you guide me through the first steps to start using Developer Hub as a developer, like exploring the Software Catalog and adding my service?
            dynamicPlugins:
              frontend:
                red-hat-developer-hub.backstage-plugin-intelligent-assistant:
                  translationResources:
                    - importName: lightspeedTranslations
                      module: Alpha
                      ref: intelligentAssistantTranslationRef
                  dynamicRoutes:
                    - path: /intelligent-assistant
                      importName: LightspeedPage
                      module: Legacy
                  mountPoints:
                    - mountPoint: application/listener
                      importName: LightspeedFAB
                      module: Legacy
                    - mountPoint: application/provider
                      importName: LightspeedDrawerProvider
                      module: Legacy
                    - mountPoint: application/internal/drawer-state
                      importName: LightspeedDrawerStateExposer
                      module: Legacy
                      config:
                        id: intelligent-assistant
                    - mountPoint: application/internal/drawer-content
                      importName: LightspeedChatContainer
                      module: Legacy
                      config:
                        id: intelligent-assistant
                        priority: 100
        
        # Backend plugin
        - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-intelligent-assistant-backend:bs_1.54.9__5.3.10!red-hat-developer-hub-backstage-plugin-intelligent-assistant-backend
          enabled: true
          pluginConfig:
            intelligent-assistant:
              # OPTIONAL: Port for intelligent-assistant service (default: 8080)
              servicePort: 8080

              # OPTIONAL: Enable screen context (page content shared with the assistant)
              # screen-context:
              #   enabled: true

              # OPTIONAL: MCP server name and token for MCP servers defined in Lightspeed Core (LCORE) config
              # mcpServers:
              #  - name: <mcp server name>
              #    token: ${MCP_TOKEN}

              # OPTIONAL: Per-user rate limits (defaults: expensive 25/min, general 200/min)
              # rateLimit:
              #   expensive:
              #     max: 25
              #   general:
              #     max: 200

              # OPTIONAL: Notebooks feature (Developer Preview) — requires Lightspeed Core
              # and Llama Stack; model and provider_id must be configured together
              # notebooks:
              #   enabled: true
              #   queryDefaults:
              #     model: ${NOTEBOOKS_QUERY_MODEL}
              #     provider_id: ${NOTEBOOKS_QUERY_PROVIDER_ID}

              # OPTIONAL: Override default RHDH system prompt
              # systemPrompt: "You are a helpful assistant focused on Red Hat Developer Hub development."
      ```
      
      ### Static Installation for Backstage application.

      This section documents the static method of installing plugin packages in a Backstage application.
      Use this approach only when you want to manually add and configure plugins.
      Ensure you follow each step carefully to integrate the plugin correctly within your Backstage environment.
      
      #### 1. Install Plugin Packages

      ```bash
      # Install frontend plugin
      yarn workspace app add @red-hat-developer-hub/backstage-plugin-intelligent-assistant

      # Install backend plugin
      yarn add --cwd packages/backend @red-hat-developer-hub/backstage-plugin-intelligent-assistant-backend
      ```

      #### 2. Register Backend Plugin

      Add to your `packages/backend/src/index.ts`:

      ```ts
      import { createBackend } from '@backstage/backend-defaults';

      const backend = createBackend();

      // Add the Intelligent Assistant backend plugin
      backend.add(
        import('@red-hat-developer-hub/backstage-plugin-intelligent-assistant-backend'),
      );

      backend.start();
      ```

      #### 3. Add Frontend Components

      **NFS (New Frontend System) — recommended.** Import modules from the package root and register them as features in `createApp` in `packages/app/src/App.tsx`:

      ```tsx
      import { createApp } from '@backstage/frontend-defaults';

      import { appDrawerModule } from '@red-hat-developer-hub/backstage-plugin-app-react/alpha';
      import {
        intelligentAssistantFABModule,
        intelligentAssistantRedirectModule,
        intelligentAssistantTranslationsModule,
      } from '@red-hat-developer-hub/backstage-plugin-intelligent-assistant';

      export default createApp({
        features: [
          appDrawerModule,
          intelligentAssistantFABModule,
          intelligentAssistantRedirectModule,
          intelligentAssistantTranslationsModule,
          // ...other modules
        ],
      });
      ```

      Enable the extensions in `app-config.yaml` (order matters: `app/drawer` must come before `app/intelligent-assistant-fab` for correct React Context nesting):

      ```yaml
      app:
        extensions:
          - app-root-wrapper:app/drawer
          - app-root-wrapper:app/intelligent-assistant-fab
          - translation:app/intelligent-assistant-translations
          - api:app/app-language:
              config:
                availableLanguages: ['en', 'de', 'es', 'fr', 'it', 'ja']
                defaultLanguage: 'en'
      ```

      **OFS (Old Frontend System / legacy).** Legacy components are available at the `./legacy` subpath. Add a route in `packages/app/src/App.tsx`:

      ```tsx
      import { LightspeedPage } from '@red-hat-developer-hub/backstage-plugin-intelligent-assistant/legacy';

      // Add this route within your existing routes
      <Route path="/intelligent-assistant" element={<LightspeedPage />} />
      ```

      **Add Navigation Menu Item** in `packages/app/src/components/Root/Root.tsx`:

      ```tsx
      import { LightspeedIcon } from '@red-hat-developer-hub/backstage-plugin-intelligent-assistant/legacy';

      // Add this within your existing sidebar items
      <SidebarItem
        icon={LightspeedIcon as IconComponent}
        to="intelligent-assistant"
        text="Intelligent Assistant"
      />
      ```

      #### 4. Configure the Plugin
      LLM servers are configured on Lightspeed Core (LCORE) — in RHDH deployments it runs as the `lightspeed-core` sidecar (enabled with `intelligentAssistant.enabled` in the Helm chart, or the `intelligent-assistant` flavour in the Operator's Backstage custom resource); in standalone Backstage, in the LCORE `lightspeed-stack.yaml`. Plugin-level options go in `app-config.yaml` or `app-config.local.yaml`:

      ```yaml
        intelligent-assistant:
          servicePort: 8080
          systemPrompt: "You are a helpful assistant focused on Red Hat Developer Hub development."
      ```

      ## Configuration

      ### Complete Configuration Reference

      Add the following configuration to your `app-config.yaml`:

      ```yaml
      intelligent-assistant:
        servicePort: <portNumber>              # OPTIONAL: Port for the intelligent-assistant service (default: 8080)
        systemPrompt: <system prompt>          # OPTIONAL: Override the default system prompt
        prompts:                               # OPTIONAL: Custom prompts displayed to users in the chat UI
          - title: <prompt_title>              # REQUIRED: Display title for the prompt
            message: <prompt_message>          # REQUIRED: The actual prompt text/question
        mcpServers:                            # OPTIONAL: One or more MCP servers
          - name: <mcp server name>            # REQUIRED: Must match the name configured in LCORE
            token: ${MCP_TOKEN}                # OPTIONAL: Token for the MCP server
        rateLimit:                             # OPTIONAL: Per-user request rate limits (defaults apply if omitted)
          expensive:
            max: 25                            # Max requests/minute per user for expensive endpoints (default: 25)
          general:
            max: 200                           # Max requests/minute per user for other authenticated endpoints (default: 200)
        screen-context:                        # OPTIONAL: Share current page content with the assistant
          enabled: false                       # Master switch for screen context (default: false)
          screenshots:
            enabled: true                      # Screenshot capture within screen context (default: true)
          dom-extraction:
            enabled: true                      # DOM text extraction (default: true when screen-context is on)
            maxChars: 8000                     # Max characters extracted per page (default: 8000)
        notebooks:                             # OPTIONAL: Notebooks feature (Developer Preview)
          enabled: false
      ```

      #### Configuration Fields

      | Field | Type | Required | Default | Description |
      |-------|------|----------|---------|-------------|
      | `servicePort` | Number | ❌ No | `8080` | Port for intelligent-assistant backend service |
      | `systemPrompt` | String | ❌ No | RHDH default | Custom system prompt to override default behavior |
      | `prompts` | Array | ❌ No | Built-in prompts | Custom welcome prompts for users |
      | `prompts[].title` | String | ✅ Yes* | - | Display title for the prompt (*required if prompts array is provided) |
      | `prompts[].message` | String | ✅ Yes* | - | The actual prompt text/question (*required if prompts array is provided) |
      | `mcpServers` | Array | ❌ No | - | MCP servers to expose in the assistant settings panel |
      | `mcpServers[].name` | String | ✅ Yes* | - | MCP server name; must match the name configured in LCORE |
      | `mcpServers[].token` | String | ❌ No | - | Token for the MCP server (users can override per-user) |
      | `rateLimit.expensive.max` | Number | ❌ No | `25` | Max requests/minute per user for expensive endpoints; `0` disables |
      | `rateLimit.general.max` | Number | ❌ No | `200` | Max requests/minute per user for other authenticated endpoints; `0` disables |
      | `screen-context.enabled` | Boolean | ❌ No | `false` | Master switch for screen context (users must still opt in) |
      | `screen-context.screenshots.enabled` | Boolean | ❌ No | `true` | Screenshot capture within screen context |
      | `screen-context.dom-extraction.maxChars` | Number | ❌ No | `8000` | Max characters of page text extracted per page |
      | `notebooks.enabled` | Boolean | ❌ No | `false` | Enable the Notebooks feature (Developer Preview) |

      ### Example Configurations

      #### Minimal Configuration
      ```yaml
      intelligent-assistant:
        servicePort: 8080
      ```

      #### Enable Screen Context
      ```yaml
      intelligent-assistant:
        screen-context:
          enabled: true
          screenshots:
            enabled: true
          dom-extraction:
            enabled: true
            maxChars: 8000
      ```

      #### Enable Notebooks (Developer Preview)
      Requires Lightspeed Core and an accessible Llama Stack service; `model` and `provider_id` must be configured together and map to a provider enabled in your Lightspeed config.
      ```yaml
      intelligent-assistant:
        notebooks:
          enabled: true
          queryDefaults:
            model: ${NOTEBOOKS_QUERY_MODEL}
            provider_id: ${NOTEBOOKS_QUERY_PROVIDER_ID}
          # OPTIONAL: Chunking strategy for document processing (values shown are the defaults)
          # chunkingStrategy:
          #   type: auto # 'auto' or 'static' (default: auto)
          #   maxChunkSizeTokens: 512 # For 'static' chunking (default: 512)
          #   chunkOverlapTokens: 50 # For 'static' chunking (default: 50)
      ```

      #### Custom User Prompts (Welcome Prompts in Intelligent Assistant UI)
      ```yaml
      intelligent-assistant:
        prompts:
          - title: "Get Started with RHDH"
            message: "How can I set up a new component in Red Hat Developer Hub?"
          - title: "Troubleshooting"
            message: "What are common issues when deploying to OpenShift?"
          - title: "Best Practices"
            message: "What are the recommended practices for RHDH development?"
      ```

      #### MCP Server Integration
      ```yaml
      intelligent-assistant:
        mcpServers:
          - name: mcp-integration-tools
            token: ${MCP_TOKEN}
      ```

      #### Complete Configuration with All Options
      ```yaml
      intelligent-assistant:
        servicePort: 8080
        systemPrompt: "You are a helpful assistant focused on Red Hat Developer Hub development."
        prompts:
          - title: "Quick Start"
            message: "How do I enable a dynamic plugin?"
        mcpServers:
          - name: mcp-integration-tools
            token: ${MCP_TOKEN}
        rateLimit:
          expensive:
            max: 25
          general:
            max: 200
        screen-context:
          enabled: true
        notebooks:
          enabled: true
          queryDefaults:
            model: ${NOTEBOOKS_QUERY_MODEL}
            provider_id: ${NOTEBOOKS_QUERY_PROVIDER_ID}
      ```

      ## Permissions

      The Intelligent Assistant plugin supports the Backstage permission framework for access control.

      ### RBAC Configuration

      When using the [RBAC permission framework](https://github.com/backstage/community-plugins/tree/main/workspaces/rbac/plugins/rbac-backend#installation), add the following permissions to your `rbac-policy.csv` file:

      ```csv
      # Allow team_a role to use intelligent-assistant features.
      # All permissions are granted with the "use" action.
      p, role:default/team_a, intelligent-assistant.chat, use, allow

      # Required for Notebooks feature (if enabled)
      p, role:default/team_a, intelligent-assistant.notebooks, use, allow

      # Required for MCP server management (if configured)
      p, role:default/team_a, intelligent-assistant.mcp.tools, use, allow

      # Required for Skills feature (if enabled)
      p, role:default/team_a, intelligent-assistant.skills, use, allow

      # Often required when MCP tools query the catalog
      p, role:default/team_a, catalog.entity.read, read, allow
      p, role:default/team_a, catalog.location.read, read, allow

      # Assign user to team_a role
      g, user:default/<your-user-name>, role:default/team_a
      ```

      ### Permission Configuration

      Configure the permission system in your application configuration:

      ```yaml
      permission:
        enabled: true
        rbac:
          policies-csv-file: /some/path/rbac-policy.csv
          policyFileReload: true
      ```

      ## Development

      ### Local Development

      1. **Fork and clone this repository**:

          ```bash
          git clone https://github.com/your-username/rhdh-plugins.git
          cd rhdh-plugins/workspaces/intelligent-assistant
          ```

      2. **Install dependencies**:
      
          ```bash
          yarn install
          ```

      3. **Add configurations** in `app-config.yaml` or `app-config.local.yaml`:
        
          ```yaml
          intelligent-assistant:
            servicePort: 8080
            screen-context:
              enabled: true
          ```

      4. **Start the development server**:

          ```bash
          yarn dev
          ```

      5. **Access the application** at [http://localhost:3000](http://localhost:3000) and navigate to the Intelligent Assistant page



      ### Environment Variables

      Environment variable substitution works in `app-config.yaml` for any plugin configuration value:

      - `MCP_TOKEN`: Token for an MCP server configured under `mcpServers`
      - `NOTEBOOK_DEFAULT_MODEL` / `NOTEBOOK_PROVIDER`: Notebooks query defaults (Developer Preview)

      ### Example with Environment Variables

      ```yaml
      intelligent-assistant:
        mcpServers:
          - name: mcp-integration-tools
            token: ${MCP_TOKEN}
        notebooks:
          enabled: true
          queryDefaults:
            model: ${NOTEBOOK_DEFAULT_MODEL}
            provider_id: ${NOTEBOOK_PROVIDER}
      ```

  

  description: |
      # Developer Hub Intelligent Assistant

      Red Hat Developer Hub Intelligent Assistant is a virtual assistant powered by generative AI that offers in-depth insights into Red Hat Developer Hub, including its wide range of capabilities. You can interact with this assistant to explore and learn more about Red Hat Developer Hub in greater detail.

      Developer Hub Intelligent Assistant provides a natural language interface within the Red Hat Developer Hub console, helping you easily find information about the product, understand its features, and get answers to your questions as they come up.

      Developer Hub Intelligent Assistant consists of two main components:

      - **Frontend Plugin** (`@red-hat-developer-hub/backstage-plugin-intelligent-assistant`): Provides the user interface and chat experience
      - **Backend Plugin** (`@red-hat-developer-hub/backstage-plugin-intelligent-assistant-backend`): Handles server-side logic, communication with the service sidecar, and API endpoints

      ### Key Features

      - 🤖 **LLM Integration**: LLM servers are configured on Lightspeed Core (LCORE), which runs as the `lightspeed-core` sidecar in RHDH deployments
      - 🔒 **Security**: Built-in question validation to restrict chats to Red Hat Developer Hub related topics
      - 🔒 **Permissions**: Feature-level RBAC permissions
      - 💬 **Conversational Interface**: Chat-based interaction with AI assistance
      - 🖥️ **Screen Context**: Optionally attach current page content (headings, tables, alerts, optional screenshots) to chat messages
      - 📓 **Notebooks (Developer Preview)**: RAG queries over uploaded notebook and document files
      - 🔧 **MCP Tools**: Integrate MCP servers with per-user token configuration from the settings panel
      - 🎯 **Custom Prompts**: Configurable sample and system prompts for better user experience
      - 🛡️ **Rate Limiting**: Per-user request rate limits on authenticated endpoints
      - 📊 **Session Management**: Handle user conversations and history

      ## Usage


      ### For Administrators

      1. **LLM Server Configuration**: LLM servers are configured on Lightspeed Core (LCORE) — in RHDH deployments it runs as the `lightspeed-core` sidecar (enabled with `intelligentAssistant.enabled` in the Helm chart, or the `intelligent-assistant` flavour in the Operator's Backstage custom resource); in standalone Backstage, in the LCORE `lightspeed-stack.yaml`
      2. **Configurable Prompts**: Administrators can customize the welcome prompts to guide users with specific tasks or questions and system prompts to set the context for the AI assistant
      3. **Feature Toggles**: Enable screen context, notebooks, and MCP server integration under the `intelligent-assistant` configuration key

      ### For End Users

      1. **Access the Plugin**: Navigate to your Red Hat Developer Hub portal and open the Intelligent Assistant from the floating action button
      2. **Start Chatting**: Begin asking questions about Red Hat Developer Hub, or other development topics
      3. **Display Modes**: Switch between overlay, docked, embedded, and fullscreen modes from Settings; the active conversation is preserved across mode switches
      4. **Manage Chats**: Your chat history is maintained for the session, you can start new chats, view history, and delete chats as needed.

      ### Supported Topics

      When question validation is enabled, the plugin is optimized for:
      - Red Hat Developer Hub (RHDH)

      ## Support

      - **Documentation**: [Red Hat Developer Hub Documentation](https://docs.redhat.com/en/documentation/red_hat_developer_hub)
      - **Frontend Plugin**: [Frontend README](https://github.com/redhat-developer/rhdh-plugins/tree/main/workspaces/intelligent-assistant/plugins/intelligent-assistant/README.md)
      - **Backend Plugin**: [Backend README](https://github.com/redhat-developer/rhdh-plugins/tree/main/workspaces/intelligent-assistant/plugins/intelligent-assistant-backend/README.md)
      - **Issues**: [Jira Issues](https://issues.redhat.com/browse/RHDHBUGS)


  installation: |
    ## Installation

    ### Dynamic Plugin Installation for Red Hat Developer Hub

    Add the following to your dynamic plugin configuration. The
    AI Model Server catalog module must also be installed so the
    catalog accepts `AiModelServerAPI` entities:

    ```yaml
    includes:
      - dynamic-plugins.default.yaml
    plugins:
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-ogx-entity-provider:bs_1.54.6__0.5.0
        enabled: true
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-catalog-backend-module-ai-model-server:bs_1.54.4__0.3.1
        enabled: true
    ```

    ## RHDH Configuration

    Configure the OGX server endpoint and allow `AiModelServerAPI`
    entities in the catalog:

    ```yaml
    ai-catalog:
      entityProviders:
        ogx:
          baseUrl: https://your-ogx-url
    catalog:
      rules:
        - allow:
            [
              Component,
              System,
              API,
              AiModelServerAPI,
              Resource,
              Location,
              User,
              Group,
            ]
    ```

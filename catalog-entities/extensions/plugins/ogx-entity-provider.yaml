  description: |
    # OGX Entity Provider

    A Backstage backend plugin that discovers AI model servers by
    querying the `/v1/models` endpoint of OGX servers.
    KServe `InferenceService` resources on Kubernetes clusters.

    ### How it works

    The OGX entity provider performs two complementary discovery tasks:

    1. **OGX server polling** — queries the `/v1/models` endpoint of
       configured OGX servers to retrieve the list of available models.

    For each OGX server, the provider imports an `AiModelServerAPI`
    catalog entity whose model list includes the models returned from
    the `/v1/models` endpoint.

    ### Standalone design

    The OGX entity provider is optional and depends only on the
    AI Model Server catalog module
    (`@red-hat-developer-hub/backstage-plugin-catalog-backend-module-ai-model-server`).
    It does not integrate with the model-catalog or TechDocs plugins,
    making it a lightweight alternative for environments that only need
    OGX-based model server discovery.

    ### Companion plugin

    - **AI Model Server catalog module** — registers the
      `AiModelServerAPI` kind so the catalog accepts the entities
      emitted by this provider. Must be installed alongside the OGX
      entity provider.

    ## Support

    - **Source code**: [ogx-entity-provider](https://github.com/redhat-developer/rhdh-plugins/tree/main/workspaces/boost/plugins/ogx-entity-provider)
    - **Issues**: [Jira Issues](https://issues.redhat.com/browse/RHDHBUGS)

  packages:

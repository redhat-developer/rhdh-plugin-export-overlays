  installation: |
    ## Installation

    ### Dynamic Plugin Installation for Red Hat Developer Hub

    Add the following to your dynamic plugin configuration. Install the
    AI Model Server catalog module alongside the connector so the catalog
    accepts `AiModelServerAPI` entities:

    ```yaml
    includes:
      - dynamic-plugins.default.yaml
    plugins:
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-kserve-kubeflow-connector-backend:bs_1.54.4__0.1.4
        enabled: true
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-catalog-backend-module-ai-model-server:bs_1.54.4__0.3.1
        enabled: true
    ```

    ## RHDH Configuration

    The connector supports two configuration modes for Kubernetes
    cluster access.

    ### Mode 1: Reuse Backstage Kubernetes plugin cluster

    If the Backstage Kubernetes plugin is already configured with access
    to the cluster hosting KServe, point the connector at that cluster
    using `kubernetesPluginRef`:

    ```yaml
    catalog:
      rules:
        - allow:
            [
              Component,
              System,
              API,
              AiModelServerAPI,
              Resource,
              Location,
              User,
              Group,
              AiResource,
            ]
      providers:
        modelCatalog:
          kserve-kubeflow-connector:
            cluster-1:
              name: my-k8s-cluster
              kubernetesPluginRef: my-k8s-cluster
              default-owner: '${OWNER:-default-owner}'
              default-lifecycle: '${LIFECYCLE:-production}'
    kubernetes:
      serviceLocatorMethod:
        type: 'multiTenant'
      clusterLocatorMethods:
        - type: 'config'
          clusters:
            - name: my-k8s-cluster
              url: '${K8S_CLUSTER_URL}'
              serviceAccountToken: '${K8S_SA_TOKEN}'
              authProvider: serviceAccount
              skipTLSVerify: false
              caData: '${K8S_CA_DATA:-}'
    ```

    ### Mode 2: Direct cluster connection

    When the Backstage Kubernetes plugin is not installed or does not
    define the target cluster, supply connection fields directly:

    ```yaml
    catalog:
      rules:
        - allow:
            [
              Component,
              System,
              API,
              AiModelServerAPI,
              Resource,
              Location,
              User,
              Group,
              AiResource,
            ]
      providers:
        modelCatalog:
          kserve-kubeflow-connector:
            cluster-1:
              name: my-k8s-cluster
              url: '${K8S_CLUSTER_URL:-}'
              serviceAccountToken: '${K8S_SA_TOKEN:-}'
              skipTLSVerify: false
              caData: '${K8S_CA_DATA:-}'
              default-owner: '${OWNER:-default-owner}'
              default-lifecycle: '${LIFECYCLE:-production}'
    ```

    ### Additional configuration options

    The following optional fields can be added to any cluster entry:

    - `kubeflow-model-catalog-url` — URL of the Kubeflow Model Catalog
      service. When omitted the connector attempts automatic Route
      discovery on the cluster.

    ```yaml
    kubernetes:
       serviceLocatorMethod:
         type: 'multiTenant'
       clusterLocatorMethods:
         - type: 'config'
           clusters:
             - name: my-k8s-cluster
               url: '${K8S_CLUSTER_URL}'
               serviceAccountToken: '${K8S_SA_TOKEN}'
               authProvider: serviceAccount
               skipTLSVerify: false
               caData: '${K8S_CA_DATA:-}'
    catalog:
      providers:
        modelCatalog:
          kserve-kubeflow-connector:
            cluster-1:
              name: my-k8s-cluster
              kubernetesPluginRef: my-k8s-cluster
              default-owner: my-team
              default-lifecycle: production
              kubeflow-model-catalog-url: https://model-catalog.apps.example.com
    ```

  description: |
    # KServe/Kubeflow Connector

    A Backstage backend plugin that discovers KServe `InferenceService`
    resources on Kubernetes clusters and generates `AiModelServerAPI`
    catalog entities from them.

    ### How it works

    The connector creates a Kubernetes informer for
    `serving.kserve.io` `InferenceService` resources. It watches add,
    update, and delete events, reconciling ready resources into an
    in-memory model-catalog representation. When an `InferenceService`
    supplies `rhdh.io/catalog-source` and `rhdh.io/catalog-model`
    annotations, the connector optionally fetches Kubeflow Model
    Catalog model cards for TechDocs integration.

    The connector exposes Backstage-authenticated REST routes consumed
    by the AI Model Catalog and TechDocs plugins:

    - `GET /list` — returns all discovered model servers and models
    - `GET /models/:model/:version` — returns metadata for a specific
      model version
    - `GET /modelcard/:sourceId/*` — returns model-card Markdown for
      TechDocs generation

    ### Companion plugins

    The connector is the data source for the AI Model Catalog suite.
    Install the following plugins alongside it:

    - **AI Model Server catalog module**
      (`@red-hat-developer-hub/backstage-plugin-catalog-backend-module-ai-model-server`):
      registers the `AiModelServerAPI` kind so the catalog accepts the
      entities generated from discovered model servers.
    - **Model Catalog entity provider**
      (`@red-hat-developer-hub/backstage-plugin-catalog-backend-module-model-catalog`):
      calls the connector REST endpoint and emits `AiModelServerAPI`
      catalog entities.
    - **TechDocs URL reader**
      (`@red-hat-developer-hub/backstage-plugin-catalog-techdoc-url-reader-backend`):
      resolves model-card content through the connector for TechDocs
      generation.

    ### Kubernetes access requirements

    The ServiceAccount used by the connector requires the following
    least-privilege permissions:

    - `serving.kserve.io` `InferenceService`: `get`, `list`, `watch`
    - `route.openshift.io` `Route`: `get`, `list`, `watch` (for
      automatic route discovery when no model catalog URL is configured)
    - Core `ServiceAccount`: `get`, `list`, `watch` (for authentication
      detection)

    ### InferenceService annotations

    The connector reads `rhdh.io/` annotations from InferenceService
    resources to control entity generation:

    - `rhdh.io/system` — sets `spec.system` on the generated entity
    - `rhdh.io/serverType` — overrides `spec.serverType`
    - `rhdh.io/default` — sets the default model
    - `rhdh.io/owner` — overrides the entity owner
    - `rhdh.io/lifecycle` — overrides the entity lifecycle
    - `rhdh.io/model-*` — creates multiple Model objects from a single
      InferenceService

    ### OpenShift AI documentation

    - [OpenShift AI Self-Managed 3.5](https://docs.redhat.com/en/documentation/red_hat_openshift_ai_self-managed/3.5)
    - [Manage and govern model catalog sources](https://docs.redhat.com/en/documentation/red_hat_openshift_ai_self-managed/3.5/html/manage_and_govern_model_catalog_sources/index)
    - [Deploying models](https://docs.redhat.com/en/documentation/red_hat_openshift_ai_self-managed/3.5/html/deploying_models/index)


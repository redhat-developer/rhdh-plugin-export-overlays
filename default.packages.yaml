  # NFS OOTB shell/auth prerequisites (RHIDP-15482 / RHIDP-15944 / RHDHPLAN-846).
  # TP until security scans complete for GA; must stay enabled for NFS experience.
  - package: '@red-hat-developer-hub/backstage-plugin-app-auth'

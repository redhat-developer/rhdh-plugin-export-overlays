# MANUALLY maintained list of "core plugins", which over time will become the same list as the GA plugins in the catalog
# 
# eventually this file can be generated from the catalog, setting "enabled" for those plugins with no required configuration, 
# and "disabled" for those plugins that require configuration to run
#
# Do not add packages to this list without prior agreement from PM
#
# Package support level should ONLY be "generally-available" as of 2.1, except for notable exceptions for core functionality like the extension system, and git support
#    Exception: app-auth / app-integrations / app-defaults (RHIDP-15482, RHIDP-15944) — TP but enabled OOTB for NFS shell/auth
#    Community plugins have been removed https://redhat.atlassian.net/browse/RHIDP-13262
packages:
  # should only include GA (or TP with a path to GA) content here
  enabled: 
  - package: '@backstage-community/plugin-analytics-provider-segment'
    support: "generally-available"
  - package: '@backstage-community/plugin-scaffolder-backend-module-regex'
    support: "generally-available"
  - package: '@backstage/plugin-auth-backend-module-github-provider'
    support: "generally-available"
  - package: '@backstage/plugin-auth-backend-module-guest-provider'
